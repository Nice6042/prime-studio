name: Apply reviewed Rust formatting

on:
  push:
    branches:
      - work/complete-general-settings
    paths:
      - .github/workflows/apply-cargo-fmt-general-settings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out General settings branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-general-settings
          persist-credentials: true

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Format the changed Rust source
        shell: bash
        run: |
          cargo fmt --manifest-path app/src-tauri/Cargo.toml --all
          rm .github/workflows/apply-cargo-fmt-general-settings.yml
          cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check
          git diff --check

      - name: Commit formatting and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src-tauri/src/lib.rs .github/workflows/apply-cargo-fmt-general-settings.yml
          git commit -m "style(rust): format General settings validation"
          git push origin HEAD:work/complete-general-settings
