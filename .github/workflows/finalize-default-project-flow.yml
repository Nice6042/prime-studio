name: Finalize default-project source patch

on:
  push:
    branches:
      - work/complete-general-settings
    paths:
      - .github/workflows/finalize-default-project-flow.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out General settings branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-general-settings
          persist-credentials: true

      - name: Make the staged patch anchor-independent
        shell: python
        run: |
          from pathlib import Path
          path = Path(".github/default_project_flow_patch.py")
          text = path.read_text(encoding="utf-8")

          settings_start_marker = '''replace_once(
              "app/src/features/settings/SettingsPages.tsx",
              '<Row label="Default project"'''
          settings_end_marker = '\n\nproject_test = Path("app/src/features/navigation/ProjectSidebar.test.tsx")'
          settings_start = text.index(settings_start_marker)
          settings_end = text.index(settings_end_marker, settings_start)
          settings_patch = '''settings_pages = Path("app/src/features/settings/SettingsPages.tsx")
          settings_text = settings_pages.read_text(encoding="utf-8")
          row_start = settings_text.index('      <Row label="Default project" description="New resident chats use this user-selected working directory; clearing it asks each time.">')
          row_end = settings_text.index('\n      </Row>', row_start) + len('\n      </Row>')
          before = settings_text[row_start:row_end]
          after = before.replace(
              'description="New resident chats use this user-selected working directory; clearing it asks each time."',
              'description="New folder-project dialogs start from this user-selected working directory; clearing it requires choosing a folder each time."',
          ).replace('{settings.defaultCwd || "Ask each time"}', '{settings.defaultCwd || "Choose each time"}').replace('>Ask each time</button>', '>Choose each time</button>')
          if before == after:
              raise SystemExit("SettingsPages.tsx: General workspace row did not change")
          settings_pages.write_text(settings_text[:row_start] + after + settings_text[row_end:], encoding="utf-8", newline="\\n")'''
          text = text[:settings_start] + settings_patch + text[settings_end:]

          browser_start_marker = '''replace_once(
              "app/e2e/browser-shell.spec.ts",'''
          browser_end_marker = '\n\nfor temporary in ('
          browser_start = text.index(browser_start_marker)
          browser_end = text.index(browser_end_marker, browser_start)
          browser_patch = '''browser = Path("app/e2e/browser-shell.spec.ts")
          browser_text = browser.read_text(encoding="utf-8")
          test_start = browser_text.index('test("General settings persist applied defaults and own workspace and panel layout changes"')
          insertion_point = browser_text.index('\n\n  const setRange', test_start)
          inserted = ''' + '"""' + '''
            await shellPage.getByRole("button", { name: "Back to chat" }).click();
            await shellPage.getByRole("button", { name: "New project" }).click();
            await expect(shellPage.getByRole("textbox", { name: "Folder path" })).toHaveValue("D:\\\\fixture\\\\Selected Workspace");
            await expect(shellPage.getByRole("button", { name: "Create project" })).toBeDisabled();
            await shellPage.keyboard.press("Escape");
            await shellPage.keyboard.press("Control+,");
            await shellPage.getByRole("button", { name: /^General/ }).click();''' + '"""' + '''
          if "New project" in browser_text[test_start:insertion_point]:
              raise SystemExit("browser-shell.spec.ts: default-project evidence already inserted")
          browser.write_text(browser_text[:insertion_point] + inserted + browser_text[insertion_point:], encoding="utf-8", newline="\\n")'''
          text = text[:browser_start] + browser_patch + text[browser_end:]

          tuple_anchor = '''    ".github/workflows/repair-default-project-workflow.yml",
              ".github/default_project_flow_patch.py",'''
          tuple_replacement = '''    ".github/workflows/repair-default-project-workflow.yml",
              ".github/workflows/repair-default-project-script.yml",
              ".github/workflows/finalize-default-project-flow.yml",
              ".github/default_project_flow_patch.py",'''
          if text.count(tuple_anchor) != 1:
              raise SystemExit(f"expected one temporary-file tuple anchor, found {text.count(tuple_anchor)}")
          path.write_text(text.replace(tuple_anchor, tuple_replacement), encoding="utf-8", newline="\n")

      - name: Apply reviewed default-project flow
        shell: bash
        run: python .github/default_project_flow_patch.py

      - name: Validate final tree
        shell: bash
        run: |
          grep -F 'initialFolderPath={defaultProjectFolder}' app/src/features/navigation/ProjectSidebar.tsx
          grep -F 'defaultProjectFolder={settings.defaultCwd ?? ""}' app/src/app/StudioApp.tsx
          grep -F 'New folder-project dialogs start' app/src/features/settings/SettingsPages.tsx
          grep -F 'prefills a new folder project' app/src/features/navigation/ProjectSidebar.test.tsx
          grep -F 'Folder path' app/e2e/browser-shell.spec.ts | grep -F 'toHaveValue'
          test ! -e .github/workflows/apply-default-project-flow.yml
          test ! -e .github/workflows/repair-default-project-workflow.yml
          test ! -e .github/workflows/repair-default-project-script.yml
          test ! -e .github/workflows/finalize-default-project-flow.yml
          test ! -e .github/default_project_flow_patch.py
          git diff --check

      - name: Commit reviewed default-project flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(settings): apply the default folder to new projects"
          git push origin HEAD:work/complete-general-settings
