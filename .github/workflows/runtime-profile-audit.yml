name: Runtime Profile Audit

on:
  push:
    branches:
      - "work/complete-waves-0-6"
    paths:
      - ".github/workflows/runtime-profile-audit.yml"
      - "app/scripts/audit-prime-release-profile.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-profile-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-prime-release:
    name: Audit official Prime runtime profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          check-latest: false

      - name: Audit upstream release without activation
        working-directory: app
        run: >-
          node scripts/audit-prime-release-profile.mjs
          https://github.com/PrimeIntellect-ai/prime-agent/releases/download/v0.7.2/prime-agent-0.7.2.tgz
          0.7.2
          bc5471f2a626d727b88a45eb745fff93b10c554a3c4fc5912f25d8c64b987f5e
