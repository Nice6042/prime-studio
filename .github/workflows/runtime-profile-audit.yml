name: Runtime Profile Audit

on:
  push:
    branches:
      - "work/complete-waves-0-6"
    paths:
      - ".github/workflows/runtime-profile-audit.yml"
      - "app/scripts/audit-prime-release-profile.mjs"
      - "app/scripts/audit-reviewed-prime-adapter-candidate.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-profile-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-prime-release:
    name: Audit official Prime runtime profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact upstream dependency graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PrimeIntellect-ai/prime-agent
          ref: 83a0f9f9566219551fcb6ffaf7f519a815749a58
          path: upstream-prime
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            upstream-prime/package-lock.json
          check-latest: false

      - name: Install locked Studio audit dependencies
        working-directory: app
        run: npm ci

      - name: Install exact upstream runtime dependency graph
        working-directory: upstream-prime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit upstream release without activation
        working-directory: app
        run: >-
          node scripts/audit-prime-release-profile.mjs
          https://github.com/PrimeIntellect-ai/prime-agent/releases/download/v0.7.2/prime-agent-0.7.2.tgz
          0.7.2
          bc5471f2a626d727b88a45eb745fff93b10c554a3c4fc5912f25d8c64b987f5e

      - name: Rebuild and compare the reviewed adapter candidate
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/prime-agent-0.7.2.tgz"
          package_root="$RUNNER_TEMP/prime-agent-0.7.2"
          candidate="$RUNNER_TEMP/prime-daemon-adapter-v0.7.2.mjs"
          report="$RUNNER_TEMP/prime-adapter-candidate.json"
          curl --fail --location --proto '=https' --tlsv1.2 --max-filesize 33554432 \
            --output "$archive" \
            https://github.com/PrimeIntellect-ai/prime-agent/releases/download/v0.7.2/prime-agent-0.7.2.tgz
          echo "bc5471f2a626d727b88a45eb745fff93b10c554a3c4fc5912f25d8c64b987f5e  $archive" | sha256sum --check --strict
          mkdir "$package_root"
          tar --extract --gzip --file "$archive" --directory "$package_root" --no-same-owner --no-same-permissions
          node scripts/audit-reviewed-prime-adapter-candidate.mjs \
            "$package_root/package" \
            0.7.2 \
            sha256:0b45bc86527fcdb73dae76d319f6f50f6d40827a63614303664a57e8fe41c8cf \
            sha256:0555400963ce5c9fa3059c3ed571748715d3ddda3830085eb8f12da00708d49b \
            "$candidate" \
            "$GITHUB_WORKSPACE/upstream-prime" | tee "$report"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const expected = "sha256:8097d080916562ffb8c1c80e2cc4a0640418fa5ec8e09456077d3cffb9c785e3";
            if (report.adapter.digest !== expected) throw new Error(`reviewed adapter changed: ${report.adapter.digest}`);
          ' "$report"
