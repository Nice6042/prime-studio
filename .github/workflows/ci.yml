name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: Source policy and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0

      - name: Validate fail-closed release policy
        run: node --test tests/open-source-release-readiness.check.mjs

      - name: Validate public design provenance
        run: node --test tests/design-provenance.check.mjs

      - name: Validate public package identity
        run: node --test tests/public-package-identity.check.mjs

      - name: Reject personal and captured fixture residue
        run: node --test tests/public-fixtures-privacy.check.mjs

      - name: Test GitHub publication controls validator
        run: node --test tests/github-publication-controls.test.mjs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked npm dependencies
        working-directory: app
        run: npm ci

      - name: Run frontend tests
        working-directory: app
        run: npm test -- --maxWorkers=2 --no-file-parallelism

      - name: Test dependency policy
        working-directory: app
        run: npm run test:dependency-policy

      - name: Check reducer replay
        working-directory: app
        run: npm run check

      - name: Test bundle measurement
        working-directory: app
        run: npm run test:bundle

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Enforce bundle budgets
        working-directory: app
        run: npm run measure:bundle

  browser-shell:
    name: Strict browser shell
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIME_STUDIO_BROWSER_PORT: "43173"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked npm dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Run strict browser and accessibility gate
        working-directory: app
        run: npm run test:browser-shell:strict

  rust-windows:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-10
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: Install locked npm dependencies
        working-directory: app
        run: npm ci

      - name: Verify Windows installer policy
        working-directory: app
        run: npm exec -- vitest run scripts/windows-installer-policy.test.mjs --maxWorkers=1 --no-file-parallelism

      # Tauri embeds app/dist, so create it before compiling the Rust targets.
      - name: Build frontend for Tauri
        working-directory: app
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check

      - name: Lint locked Rust targets
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --locked --all-targets --features test-support-bin -- -D warnings

      - name: Test locked Rust targets
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked --all-targets --features test-support-bin

      # This check intentionally invokes Cargo in offline mode. Run it only after
      # the locked Windows graph has been populated by the Rust gates above.
      - name: Verify deterministic notices and Windows SBOM
        run: node --test tests/third-party-artifacts.test.mjs

      - name: Build locked Rust targets
        run: cargo build --manifest-path app/src-tauri/Cargo.toml --locked
