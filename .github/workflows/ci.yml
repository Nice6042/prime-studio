name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-common-interaction:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/common-interaction-completion'
    name: Apply reviewed interaction patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out completion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/common-interaction-completion
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact reviewed edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "app/src/app/StudioApp.tsx",
              '''  useEffect(() => {
    const onKey = (event: KeyboardEvent) => {
      if (event.isComposing || event.defaultPrevented || hasOpenStudioOverlay() || !event.ctrlKey || event.altKey || event.shiftKey) return;
      const command = shortcutStudioCommand(event);
      if (!command) return;
      event.preventDefault();
      runCommand(command.id);
    };''',
              '''  useEffect(() => {
    const onKey = (event: KeyboardEvent) => {
      if (event.isComposing || event.defaultPrevented || !event.ctrlKey || event.altKey || event.shiftKey) return;
      const command = shortcutStudioCommand(event);
      if (!command) return;
      event.preventDefault();
      if (hasOpenStudioOverlay()) return;
      runCommand(command.id);
    };''',
          )
          replace_once(
              "app/src/contracts/packageAcceptance.ts",
              'row("CM-01", "Ctrl+N, Ctrl+K, Ctrl+comma, Ctrl+B, and Ctrl+J honor topmost overlay priority", "partial", ["catalog.chat.create", "palette.open", "route.settings.open", "layout.sidebar.toggle", "layout.inspector.toggle"])',
              'row("CM-01", "Ctrl+N, Ctrl+K, Ctrl+comma, Ctrl+B, and Ctrl+J honor topmost overlay priority", "complete", ["catalog.chat.create", "palette.open", "route.settings.open", "layout.sidebar.toggle", "layout.inspector.toggle"])',
          )
          replace_once(
              "app/src/contracts/packageAcceptance.ts",
              'row("CM-04", "menus, dropdowns, and popovers use outside click, focus, Escape, and unclipped overlays", "partial", ["surface.popover.toggle", "overlay.topmost.close"])',
              'row("CM-04", "menus, dropdowns, and popovers use outside click, focus, Escape, and unclipped overlays", "complete", ["surface.popover.toggle", "overlay.topmost.close"])',
          )
          replace_once(
              "app/src/contracts/packageAcceptance.test.ts",
              '''      complete: 74,
      partial: 39,''',
              '''      complete: 76,
      partial: 37,''',
          )
          replace_once(
              "app/src/contracts/packageAcceptance.test.ts",
              '''  it("keeps the current development snapshot outside the release-ready state", () => {''',
              '''  it("records topmost shortcut and shared popover ownership as complete", () => {
    const status = (id: string) => FEATURE_ACCEPTANCE.find((feature) => feature.id === id)?.current;

    expect(status("CM-01")).toBe("complete");
    expect(status("CM-04")).toBe("complete");
    expect(PRODUCTION_BRIDGE_REAUDIT_FEATURE_IDS).not.toContain("CM-01");
    expect(PRODUCTION_BRIDGE_REAUDIT_FEATURE_IDS).not.toContain("CM-04");
  });

  it("keeps the current development snapshot outside the release-ready state", () => {''',
          )
          PY
          git diff --check

      - name: Restore permanent workflows and commit
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/apply-common-interaction-completion.yml
          git config user.name "Prime Studio Automation"
          git config user.email "193861067+Nice6042@users.noreply.github.com"
          git add app/src/app/StudioApp.tsx app/src/contracts/packageAcceptance.ts app/src/contracts/packageAcceptance.test.ts .github/workflows/ci.yml .github/workflows/apply-common-interaction-completion.yml
          git commit -m "feat(surface): complete topmost interaction ownership"
          git push origin HEAD:work/common-interaction-completion

  source-policy:
    name: Source policy and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Validate fail-closed release policy
        run: node --test tests/open-source-release-readiness.check.mjs

      - name: Validate public design provenance
        run: node --test tests/design-provenance.check.mjs

      - name: Validate public package identity
        run: node --test tests/public-package-identity.check.mjs

      - name: Reject personal and captured fixture residue
        run: node --test tests/public-fixtures-privacy.check.mjs

      - name: Test GitHub publication controls validator
        run: node --test tests/github-publication-controls.test.mjs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked npm dependencies
        working-directory: app
        run: npm ci

      - name: Run frontend tests
        working-directory: app
        run: npm test -- --maxWorkers=2 --no-file-parallelism

      - name: Test dependency policy
        working-directory: app
        run: npm run test:dependency-policy

      - name: Check reducer replay
        working-directory: app
        run: npm run check

      - name: Test bundle measurement
        working-directory: app
        run: npm run test:bundle

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Enforce typed Harness boundaries
        working-directory: app
        run: npm run check:harness-boundaries

      - name: Enforce bundle budgets
        working-directory: app
        run: npm run measure:bundle

  browser-shell:
    name: Strict browser shell
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIME_STUDIO_BROWSER_PORT: "43173"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked npm dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Run strict browser and accessibility gate
        working-directory: app
        run: npm run test:browser-shell:strict

  rust-windows:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-10
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: Install locked npm dependencies
        working-directory: app
        run: npm ci

      - name: Verify Windows installer policy
        working-directory: app
        run: npm exec -- vitest run scripts/windows-installer-policy.test.mjs --maxWorkers=1 --no-file-parallelism

      # Tauri embeds app/dist, so create it before compiling the Rust targets.
      - name: Build frontend for Tauri
        working-directory: app
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check

      - name: Lint locked Rust targets
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --locked --all-targets --features test-support-bin -- -D warnings

      - name: Test locked Rust targets
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked --all-targets --features test-support-bin

      # This check intentionally invokes Cargo in offline mode. Run it only after
      # the locked Windows graph has been populated by the Rust gates above.
      - name: Verify deterministic notices and Windows SBOM
        run: node --test tests/third-party-artifacts.test.mjs

      - name: Build locked Rust targets
        run: cargo build --manifest-path app/src-tauri/Cargo.toml --locked
