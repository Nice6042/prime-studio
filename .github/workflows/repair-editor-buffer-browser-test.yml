name: Repair editor buffer browser evidence

on:
  push:
    branches:
      - work/editor-buffer-persistence
    paths:
      - .github/workflows/repair-editor-buffer-browser-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRIME_STUDIO_BROWSER_PORT: 43173
    steps:
      - name: Check out editor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/editor-buffer-persistence
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Repair identity-bound artifact reopen evidence
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path("app/e2e/acceptance-matrix.spec.ts")
          text = path.read_text(encoding="utf-8")
          before = dedent('''
              await shellPage.getByRole("button", { name: "Open editor" }).click();
              await expect(editor.getByRole("textbox", { name: "File content" })).toHaveValue("Unapplied file draft.");
              await editor.getByRole("button", { name: "Close editor" }).click();

              await harness.locator("summary").filter({ hasText: /^Sources/u }).click();
          ''').strip()
          after = dedent('''
              const report = harness.getByRole("button", { name: /Harness report/ });
              if (!(await report.isVisible())) {
                await harness.locator("summary").filter({ hasText: /^Outputs/u }).click();
              }
              await report.click();
              await editor.getByRole("tab", { name: "Edit" }).click();
              await expect(editor.getByRole("textbox", { name: "File content" })).toHaveValue("Unapplied file draft.");
              await editor.getByRole("button", { name: "Close editor" }).click();

              await harness.locator("summary").filter({ hasText: /^Sources/u }).click();
          ''').strip()
          if text.count(before) != 1:
              raise SystemExit(f"expected one browser-evidence anchor, found {text.count(before)}")
          path.write_text(text.replace(before, after), encoding="utf-8", newline="\n")

      - name: Run exact failing browser scenario
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test e2e/acceptance-matrix.spec.ts \
            --config=e2e/playwright.config.ts \
            --project=browser-shell-chromium \
            --grep='file and Canvas drafts persist without crossing editor identities' \
            --workers=1 \
            --retries=0

      - name: Commit repaired evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/acceptance-matrix.spec.ts
          git commit -m "test(editor): reopen exact artifact before restoring its draft"
          git push origin HEAD:work/editor-buffer-persistence
