name: Apply Studio operation streaming fixture

on:
  push:
    branches:
      - work/complete-product-reflow
    paths:
      - .github/workflows/apply-studio-operation-streaming-fixture.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-product-reflow
          persist-credentials: true

      - name: Patch the exact Studio operation fixture
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/e2e/support/browser-shell.ts")
          text = path.read_text(encoding="utf-8")
          input_line = '              const input = sessionKind === "abort" ? 0 : Math.max(1, Math.ceil((text ?? "").length / 4));'
          assistant_line = '                { channel: "parent", kind: "assistant", id: `${request.operationId}-assistant`, blocks: [{ kind: "text", text: "Synthetic Harness response admitted through the verified Studio protocol." }], streaming: false, emittedAtMs: 1_775_995_220_001 },'
          if text.count(input_line) != 1:
              raise SystemExit("expected one Studio operation input line")
          if text.count(assistant_line) != 1:
              raise SystemExit("expected one Studio operation assistant line")
          text = text.replace(
              input_line,
              '              const streamingFixture = sessionKind !== "abort" && (text === "PRIME_STUDIO_REFLOW_STREAMING_FIXTURE" || global.__PRIME_STUDIO_REFLOW_STREAMING__ === true);\n              global.__PRIME_STUDIO_REFLOW_STREAMING__ = false;\n' + input_line,
          )
          text = text.replace(
              assistant_line,
              '                { channel: "parent", kind: "assistant", id: `${request.operationId}-assistant`, blocks: [{ kind: "text", text: streamingFixture ? "Synthetic streaming response retained for deterministic reflow evidence." : "Synthetic Harness response admitted through the verified Studio protocol." }], streaming: streamingFixture, emittedAtMs: 1_775_995_220_001 },',
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-studio-operation-streaming-fixture.yml").unlink()

      - name: Validate final tree
        shell: bash
        run: |
          grep -F 'const streamingFixture = sessionKind !== "abort"' app/e2e/support/browser-shell.ts
          grep -F 'id: `${request.operationId}-assistant`' app/e2e/support/browser-shell.ts | grep -F 'streaming: streamingFixture'
          test ! -e .github/workflows/apply-studio-operation-streaming-fixture.yml
          git diff --check

      - name: Commit the fixture and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/support/browser-shell.ts .github/workflows/apply-studio-operation-streaming-fixture.yml
          git commit -m "test(e2e): stream through the actual Studio operation path"
          git push origin HEAD:work/complete-product-reflow
