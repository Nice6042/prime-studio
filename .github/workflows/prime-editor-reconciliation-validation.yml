name: Repair editor reconciliation validation

on:
  push:
    branches:
      - work/editor-buffer-persistence
    paths:
      - .github/workflows/prime-editor-reconciliation-validation.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out editor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/editor-buffer-persistence
          persist-credentials: true

      - name: Make validation fetch the comparison ref
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/rebase-editor-buffer-integration-v2.yml")
          text = path.read_text(encoding="utf-8")
          anchor = "          git diff --exit-code origin/main -- app/src/contracts/packageAcceptance.ts app/src/contracts/packageAcceptance.test.ts\n"
          replacement = "          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main\n" + anchor
          if text.count(anchor) != 1:
              raise SystemExit("editor validation anchor unavailable or repeated")
          path.write_text(text.replace(anchor, replacement), encoding="utf-8", newline="\n")
          Path(".github/workflows/prime-editor-reconciliation-validation.yml").unlink()

      - name: Commit validation repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main' .github/workflows/rebase-editor-buffer-integration-v2.yml
          test ! -e .github/workflows/prime-editor-reconciliation-validation.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rebase-editor-buffer-integration-v2.yml .github/workflows/prime-editor-reconciliation-validation.yml
          git commit -m "chore(dev): fetch main during editor reconciliation validation"
          git push origin HEAD:work/editor-buffer-persistence
