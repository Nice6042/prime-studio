name: Patch reflow fixtures

on:
  push:
    branches:
      - "work/complete-product-reflow"
    paths:
      - ".github/workflows/patch-reflow-fixtures.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-product-reflow

      - name: Apply reviewed fixture repairs
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const supportPath = 'app/e2e/support/browser-shell.ts';
          let support = fs.readFileSync(supportPath, 'utf8');
          const oldSettings = [
            '      let appSettings: Record<string, string | null> = {',
            '        theme: "dark",',
            '        defaultAccount: "account-e2e",',
            '        defaultProvider: "openai-codex",',
            '        defaultModel: "gpt-5",',
            '        defaultThinking: "high",',
            '        defaultCwd: "D:\\\\fixture\\\\Prime Studio",',
            '        lastSection: "accounts",',
            '      };',
          ].join('\n');
          const newSettings = [
            '      const reflowHarnessDefaults = window.sessionStorage.getItem("prime-studio-reflow-harness-defaults") === "1";',
            '      let appSettings: Record<string, string | null> = {',
            '        theme: "dark",',
            '        defaultAccount: reflowHarnessDefaults ? null : "account-e2e",',
            '        defaultProvider: reflowHarnessDefaults ? null : "openai-codex",',
            '        defaultModel: reflowHarnessDefaults ? null : "gpt-5",',
            '        defaultThinking: reflowHarnessDefaults ? null : "high",',
            '        defaultCwd: "D:\\\\fixture\\\\Prime Studio",',
            '        lastSection: "accounts",',
            '      };',
          ].join('\n');
          if (!support.includes(oldSettings)) throw new Error('browser settings fixture not found');
          support = support.replace(oldSettings, newSettings);
          fs.writeFileSync(supportPath, support);

          const specPath = 'app/e2e/browser-shell.spec.ts';
          let spec = fs.readFileSync(specPath, 'utf8');
          const oldTransition = [
            '  await shellPage.setViewportSize({ width: 1280, height: 800 });',
            '  const expandedCollapse = shellPage.locator(\'[data-control-id="sidebar.collapse"]\');',
          ].join('\n');
          const newTransition = [
            '  await shellPage.setViewportSize({ width: 1280, height: 800 });',
            '  await expect(shellPage.getByRole("navigation", { name: "Projects and chats" })).toHaveAttribute("data-mode", "pane");',
            '  const expandedCollapse = shellPage.locator(\'[data-control-id="sidebar.collapse"]\');',
          ].join('\n');
          if (!spec.includes(oldTransition)) throw new Error('adaptive focus transition not found');
          spec = spec.replace(oldTransition, newTransition);
          fs.writeFileSync(specPath, spec);
          NODE
          git diff --check

      - name: Commit repairs
        run: |
          git config user.name "Prime Studio automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/e2e/support/browser-shell.ts app/e2e/browser-shell.spec.ts
          git commit -m "test(reflow): stabilize Harness-default and host transitions"
          git push origin HEAD:work/complete-product-reflow
