name: Apply compact reflow and streaming fixture fixes

on:
  push:
    branches:
      - work/complete-product-reflow
    paths:
      - .github/workflows/apply-reflow-runtime-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-product-reflow
          persist-credentials: true

      - name: Apply reviewed fixes
        shell: python
        run: |
          from pathlib import Path

          fixture = Path("app/e2e/support/browser-shell.ts")
          text = fixture.read_text(encoding="utf-8")
          type_line = '        __PRIME_STUDIO_PACKAGED_LICENSE_OPENS__?: number;'
          init_line = '      global.__PRIME_STUDIO_PACKAGED_LICENSE_OPENS__ = 0;'
          stream_line = '            const streamingFixture = request.kind !== "abort" && request.text === "PRIME_STUDIO_REFLOW_STREAMING_FIXTURE";'
          if text.count(type_line) != 1 or text.count(init_line) != 1 or text.count(stream_line) != 1:
              raise SystemExit("streaming fixture patch anchors are not unique")
          text = text.replace(type_line, type_line + '\n        __PRIME_STUDIO_REFLOW_STREAMING__?: boolean;')
          text = text.replace(init_line, init_line + '\n      global.__PRIME_STUDIO_REFLOW_STREAMING__ = false;')
          text = text.replace(
              stream_line,
              '            const streamingFixture = request.kind !== "abort" && (request.text === "PRIME_STUDIO_REFLOW_STREAMING_FIXTURE" || global.__PRIME_STUDIO_REFLOW_STREAMING__ === true);\n            global.__PRIME_STUDIO_REFLOW_STREAMING__ = false;',
          )
          fixture.write_text(text, encoding="utf-8", newline="\n")

          spec = Path("app/e2e/product-reflow.spec.ts")
          text = spec.read_text(encoding="utf-8")
          fill_line = '  await composer.fill(STREAMING_REFLOW_FIXTURE);'
          if text.count(fill_line) != 1:
              raise SystemExit("streaming test patch anchor is not unique")
          text = text.replace(
              fill_line,
              '  await page.evaluate(() => {\n    const global = window as typeof window & { __PRIME_STUDIO_REFLOW_STREAMING__?: boolean };\n    global.__PRIME_STUDIO_REFLOW_STREAMING__ = true;\n  });\n' + fill_line,
          )
          spec.write_text(text, encoding="utf-8", newline="\n")

          css = Path("app/src/features/conversation/conversation.css")
          text = css.read_text(encoding="utf-8")
          marker = '/* compact-height popover containment */'
          if marker in text:
              raise SystemExit("compact-height containment already exists")
          text += '''\n\n/* compact-height popover containment */
          @media (max-height: 320px) {
            .conversation-popover {
              max-block-size: calc(100vh - 100px);
              max-block-size: calc(100dvh - 100px);
              overflow-y: auto;
              overscroll-behavior: contain;
              scrollbar-gutter: stable;
            }
            .conversation-dialog-backdrop {
              padding: 8px;
              overflow: auto;
            }
            .conversation-dialog {
              max-block-size: calc(100vh - 16px);
              max-block-size: calc(100dvh - 16px);
              overflow: auto;
            }
          }
          '''
          css.write_text(text, encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-reflow-runtime-fixes.yml").unlink()

      - name: Validate final tree
        shell: bash
        run: |
          grep -F '__PRIME_STUDIO_REFLOW_STREAMING__?: boolean' app/e2e/support/browser-shell.ts
          grep -F 'global.__PRIME_STUDIO_REFLOW_STREAMING__ = true' app/e2e/product-reflow.spec.ts
          grep -F 'compact-height popover containment' app/src/features/conversation/conversation.css
          test ! -e .github/workflows/apply-reflow-runtime-fixes.yml
          git diff --check

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/support/browser-shell.ts app/e2e/product-reflow.spec.ts app/src/features/conversation/conversation.css .github/workflows/apply-reflow-runtime-fixes.yml
          git commit -m "fix(reflow): bound compact menus and retain streaming evidence"
          git push origin HEAD:work/complete-product-reflow
