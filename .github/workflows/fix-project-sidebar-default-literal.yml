name: Repair JSX default folder literal

on:
  push:
    branches:
      - work/complete-general-settings
    paths:
      - .github/workflows/fix-project-sidebar-default-literal.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out General settings branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-general-settings
          persist-credentials: true

      - name: Replace the raw JSX attribute with an explicit JavaScript path value
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/features/navigation/ProjectSidebar.test.tsx")
          text = path.read_text(encoding="utf-8")
          before = r'defaultProjectFolder="D:\\work\\prime"'
          after = r'defaultProjectFolder={String.raw`D:\work\prime`}'
          if text.count(before) != 1:
              raise SystemExit(f"expected one raw JSX path literal, found {text.count(before)}")
          path.write_text(text.replace(before, after), encoding="utf-8", newline="\n")
          Path(".github/workflows/fix-project-sidebar-default-literal.yml").unlink()

      - name: Validate final tree
        shell: bash
        run: |
          grep -F 'defaultProjectFolder={String.raw`D:\work\prime`}' app/src/features/navigation/ProjectSidebar.test.tsx
          test ! -e .github/workflows/fix-project-sidebar-default-literal.yml
          git diff --check

      - name: Commit repaired literal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(navigation): pass the default folder as a JavaScript value"
          git push origin HEAD:work/complete-general-settings
