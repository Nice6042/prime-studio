name: Repair Canvas source-version visibility

on:
  push:
    branches:
      - work/editor-buffer-persistence
    paths:
      - .github/workflows/repair-editor-source-version-visibility.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out editor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/editor-buffer-persistence
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Invalidate Canvas projection when the selected source version changes
        shell: python
        run: |
          from pathlib import Path

          def block(*lines: str) -> str:
              return "\n".join(lines)

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(before, after)

          app = Path("app/src/app/StudioApp.tsx")
          text = app.read_text(encoding="utf-8")
          text = replace_once(
              text,
              block(
                  '        const activeCanvas = canvasRef.current;',
                  '        const requestedIdentityOwned = Boolean(',
                  '          activeCanvas',
                  '          && activeCanvas.chatId === chatId',
                  '          && activeCanvas.messageId === messageId',
                  '          && documentId === canvasEditorDocumentId({ ...activeCanvas, displayRevision: expectedRevision })',
                  '        );',
              ),
              block(
                  '        const activeCanvas = canvasRef.current;',
                  '        const activeVersionState = store.getSnapshot().conversationDisplay[chatId]?.messages[messageId];',
                  '        const activeSourceVersion = activeVersionState?.kind === "assistant" ? activeVersionState.selected : 0;',
                  '        const requestedIdentityOwned = Boolean(',
                  '          activeCanvas',
                  '          && activeCanvas.chatId === chatId',
                  '          && activeCanvas.messageId === messageId',
                  '          && activeCanvas.sourceVersion === activeSourceVersion',
                  '          && documentId === canvasEditorDocumentId({ ...activeCanvas, displayRevision: expectedRevision })',
                  '        );',
              ),
              "Canvas Apply source-version ownership",
          )
          text = replace_once(
              text,
              block(
                  '        const visibleArtifact = editorArtifact?.ref.rootSessionId === selectedSession?.sessionId ? editorArtifact : null;',
                  '        const visibleCanvas = canvas?.chatId === navigation.selectedChatId && canvas.sessionId === selectedSession?.sessionId ? canvas : null;',
                  '        const activeDocumentId = visibleArtifact',
              ),
              block(
                  '        const visibleArtifact = editorArtifact?.ref.rootSessionId === selectedSession?.sessionId ? editorArtifact : null;',
                  '        const canvasVersionState = canvas ? conversationDisplay[canvas.chatId]?.messages[canvas.messageId] : undefined;',
                  '        const selectedCanvasSourceVersion = canvasVersionState?.kind === "assistant" ? canvasVersionState.selected : 0;',
                  '        const visibleCanvas = canvas?.chatId === navigation.selectedChatId',
                  '          && canvas.sessionId === selectedSession?.sessionId',
                  '          && canvas.sourceVersion === selectedCanvasSourceVersion',
                  '          ? canvas',
                  '          : null;',
                  '        const activeDocumentId = visibleArtifact',
              ),
              "mode source-version visibility",
          )
          text = replace_once(
              text,
              block(
                  '  const visibleArtifact = editorArtifact?.ref.rootSessionId === selectedSession?.sessionId ? editorArtifact : null;',
                  '  const visibleCanvas = canvas?.chatId === navigation.selectedChatId && canvas.sessionId === selectedSession?.sessionId ? canvas : null;',
                  '  const activeEditorDocumentId = visibleArtifact',
              ),
              block(
                  '  const visibleArtifact = editorArtifact?.ref.rootSessionId === selectedSession?.sessionId ? editorArtifact : null;',
                  '  const canvasVersionState = canvas ? conversationDisplay[canvas.chatId]?.messages[canvas.messageId] : undefined;',
                  '  const selectedCanvasSourceVersion = canvasVersionState?.kind === "assistant" ? canvasVersionState.selected : 0;',
                  '  const visibleCanvas = canvas?.chatId === navigation.selectedChatId',
                  '    && canvas.sessionId === selectedSession?.sessionId',
                  '    && canvas.sourceVersion === selectedCanvasSourceVersion',
                  '    ? canvas',
                  '    : null;',
                  '  const activeEditorDocumentId = visibleArtifact',
              ),
              "render source-version visibility",
          )
          app.write_text(text, encoding="utf-8", newline="\n")

          tests = Path("app/src/app/StudioApp.test.tsx")
          text = tests.read_text(encoding="utf-8")
          text = replace_once(
              text,
              block(
                  '      const successorDraft = screen.getByRole("textbox", { name: "Canvas content" });',
                  '      await userEvent.type(successorDraft, " successor draft");',
                  '      expect(successorDraft).toHaveValue("Studio-only revision successor draft");',
                  '      let replay: StudioOperationOutcome | undefined;',
                  '      let foreignIdentity: StudioOperationOutcome | undefined;',
                  '      let stale: StudioOperationOutcome | undefined;',
              ),
              block(
                  '      const successorDraft = screen.getByRole("textbox", { name: "Canvas content" });',
                  '      await userEvent.type(successorDraft, " successor draft");',
                  '      expect(successorDraft).toHaveValue("Studio-only revision successor draft");',
                  '      store.dispatch({ type: "conversation/version-appended", chatId: chat.id, messageId: "a1", kind: "assistant", text: "Alternate answer" });',
                  '      store.dispatch({ type: "conversation/version-selected", chatId: chat.id, messageId: "a1", kind: "assistant", version: 0 });',
                  '      let replay: StudioOperationOutcome | undefined;',
                  '      let foreignIdentity: StudioOperationOutcome | undefined;',
                  '      let stale: StudioOperationOutcome | undefined;',
                  '      let changedSourceVersion: StudioOperationOutcome | undefined;',
                  '      let sourceVersionReplay: StudioOperationOutcome | undefined;',
              ),
              "alternate source-version setup",
          )
          text = replace_once(
              text,
              block(
                  '        foreignIdentity = await activeDispatch({ action: "editor.canvas.apply", payload: { documentId: JSON.stringify(["canvas", rootSession.sessionId, chat.id, "a1", 1, 1]), chatId: chat.id, messageId: "a1", expectedRevision: 1, content: "Studio-only revision" } });',
                  '        stale = await activeDispatch({ action: "editor.canvas.apply", payload: { documentId: JSON.stringify(["canvas", rootSession.sessionId, chat.id, "a1", 0, 1]), chatId: chat.id, messageId: "a1", expectedRevision: 1, content: "stale overwrite" } });',
              ),
              block(
                  '        foreignIdentity = await activeDispatch({ action: "editor.canvas.apply", payload: { documentId: JSON.stringify(["canvas", rootSession.sessionId, chat.id, "a1", 1, 1]), chatId: chat.id, messageId: "a1", expectedRevision: 1, content: "Studio-only revision" } });',
                  '        stale = await activeDispatch({ action: "editor.canvas.apply", payload: { documentId: JSON.stringify(["canvas", rootSession.sessionId, chat.id, "a1", 0, 1]), chatId: chat.id, messageId: "a1", expectedRevision: 1, content: "stale overwrite" } });',
                  '        changedSourceVersion = await activeDispatch({ action: "conversation.assistant-version.select", payload: { chatId: chat.id, messageId: "a1", version: 1 } });',
                  '        sourceVersionReplay = await activeDispatch(apply);',
              ),
              "source-version replay operations",
          )
          text = replace_once(
              text,
              block(
                  '      expect(foreignIdentity).toEqual({ status: "rejected", reason: "The Canvas display revision changed before Apply completed.", retryable: false });',
                  '      expect(stale).toEqual({ status: "rejected", reason: "The Canvas display revision changed before Apply completed.", retryable: false });',
                  '      expect(screen.queryByText("stale overwrite")).not.toBeInTheDocument();',
              ),
              block(
                  '      expect(foreignIdentity).toEqual({ status: "rejected", reason: "The Canvas display revision changed before Apply completed.", retryable: false });',
                  '      expect(stale).toEqual({ status: "rejected", reason: "The Canvas display revision changed before Apply completed.", retryable: false });',
                  '      expect(changedSourceVersion).toEqual({ status: "updated", revision: 1 });',
                  '      expect(sourceVersionReplay).toEqual({ status: "rejected", reason: "The Canvas display revision changed before Apply completed.", retryable: false });',
                  '      expect(screen.queryByText("stale overwrite")).not.toBeInTheDocument();',
                  '      expect(await screen.findByText("No verified file or Canvas revision")).toBeVisible();',
              ),
              "source-version replay expectations",
          )
          text = replace_once(
              text,
              block(
                  '      const editorRegion = screen.getByRole("region", { name: "Editor" });',
                  '      await userEvent.click(within(editorRegion).getByRole("button", { name: "Close editor" }));',
                  '      await userEvent.click(screen.getByRole("button", { name: "Edit answer in Canvas" }));',
                  '      expect(await screen.findByRole("textbox", { name: "Canvas content" })).toHaveValue("Studio-only revision successor draft");',
              ),
              block(
                  '      await act(async () => {',
                  '        if (!activeDispatch) throw new Error("Studio dispatcher was not installed");',
                  '        await activeDispatch({ action: "conversation.assistant-version.select", payload: { chatId: chat.id, messageId: "a1", version: 0 } });',
                  '      });',
                  '      await userEvent.click(screen.getByRole("button", { name: "Edit answer in Canvas" }));',
                  '      expect(await screen.findByRole("textbox", { name: "Canvas content" })).toHaveValue("Studio-only revision successor draft");',
              ),
              "source-version restoration",
          )
          tests.write_text(text, encoding="utf-8", newline="\n")

      - name: Run focused regressions and production build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run src/app/StudioApp.test.tsx src/features/editor/EditorPane.test.tsx src/features/editor/editorBufferStore.test.ts --maxWorkers=2 --no-file-parallelism
          npm run build

      - name: Commit source-version ownership repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/app/StudioApp.tsx app/src/app/StudioApp.test.tsx
          git commit -m "fix(editor): hide Canvas when its source version is no longer selected"
          git push origin HEAD:work/editor-buffer-persistence
