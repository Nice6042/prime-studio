name: Repair exact Canvas editor identity

on:
  push:
    branches:
      - work/editor-buffer-persistence
    paths:
      - .github/workflows/repair-editor-canvas-identity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out editor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/editor-buffer-persistence
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Bind Apply to the opaque Canvas document and share safe truncation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(before, after)

          contract = Path("app/src/contracts/studioOperations.ts")
          text = contract.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '  "editor.canvas.apply": Readonly<{ chatId: string; messageId: string; expectedRevision: number; content: string }>;',
              '  "editor.canvas.apply": Readonly<{ documentId: string; chatId: string; messageId: string; expectedRevision: number; content: string }>;',
              "Canvas operation identity",
          )
          contract.write_text(text, encoding="utf-8", newline="\n")

          store = Path("app/src/features/editor/editorBufferStore.ts")
          text = store.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'function boundedContent(content: string): string {',
              'export function boundEditorBufferContent(content: string): string {',
              "shared content bound export",
          )
          text = replace_once(text, '  const nextContent = boundedContent(content);', '  const nextContent = boundEditorBufferContent(content);', "buffer write bound")
          store.write_text(text, encoding="utf-8", newline="\n")

          pane = Path("app/src/features/editor/EditorPane.tsx")
          text = pane.read_text(encoding="utf-8")
          import_anchor = 'import type { ArtifactDocument } from "../../entities/editor/types";'
          text = replace_once(
              text,
              import_anchor,
              import_anchor + '\nimport { boundEditorBufferContent } from "./editorBufferStore";',
              "EditorPane bound import",
          )
          text = replace_once(
              text,
              '      const outcome = await onExecute({ action: "editor.canvas.apply", payload: { chatId: canvas.chatId, messageId: canvas.messageId, expectedRevision: canvas.displayRevision, content } });',
              '      const outcome = await onExecute({ action: "editor.canvas.apply", payload: { documentId: requestedDocumentId, chatId: canvas.chatId, messageId: canvas.messageId, expectedRevision: canvas.displayRevision, content } });',
              "Canvas Apply operation payload",
          )
          text = replace_once(
              text,
              '          const next = event.target.value.slice(0, 2 * 1024 * 1024);',
              '          const next = boundEditorBufferContent(event.target.value);',
              "surrogate-safe editor input bound",
          )
          pane.write_text(text, encoding="utf-8", newline="\n")

          pane_test = Path("app/src/features/editor/EditorPane.test.tsx")
          text = pane_test.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '      payload: { chatId: "chat-1", messageId: "message-1", expectedRevision: 2, content: "Edited answer" },',
              '      payload: { documentId: JSON.stringify(["canvas", "session-one", "chat-1", "message-1", 0, 2]), chatId: "chat-1", messageId: "message-1", expectedRevision: 2, content: "Edited answer" },',
              "EditorPane Apply expectation",
          )
          pane_test.write_text(text, encoding="utf-8", newline="\n")

          app = Path("app/src/app/StudioApp.tsx")
          text = app.read_text(encoding="utf-8")
          case_start = text.find('      case "editor.canvas.apply": {')
          case_end = text.find('      case "workspace.switch":', case_start)
          if case_start < 0 or case_end < 0:
              raise SystemExit("Canvas Apply case unavailable")
          case = text[case_start:case_end]
          old_head_start = case.find('        const { chatId, messageId, expectedRevision, content } = operation.payload;')
          old_head_end = case.find('        const current = store.getSnapshot().canvasRevisions', old_head_start)
          if old_head_start < 0 or old_head_end < 0:
              raise SystemExit("Canvas Apply identity head unavailable")
          identity_head = "\n".join([
              '        const { documentId, chatId, messageId, expectedRevision, content } = operation.payload;',
              '        const activeCanvas = canvasRef.current;',
              '        const requestedIdentityOwned = Boolean(',
              '          activeCanvas',
              '          && activeCanvas.chatId === chatId',
              '          && activeCanvas.messageId === messageId',
              '          && documentId === canvasEditorDocumentId({ ...activeCanvas, displayRevision: expectedRevision })',
              '        );',
          ]) + "\n"
          case = case[:old_head_start] + identity_head + case[old_head_end:]
          case = replace_once(
              case,
              '        if (currentRevision === expectedRevision + 1 && currentContent === content) {\n          if (activeDocumentId) setEditorBuffers((currentBuffers) => removeEditorBuffer(currentBuffers, activeDocumentId));\n          return { status: "updated", revision: currentRevision };\n        }',
              '        if (currentRevision === expectedRevision + 1 && currentContent === content) {\n          if (!requestedIdentityOwned) return { status: "rejected", reason: "The Canvas display revision changed before Apply completed.", retryable: false };\n          setEditorBuffers((currentBuffers) => removeEditorBuffer(currentBuffers, documentId));\n          return { status: "updated", revision: currentRevision };\n        }',
              "idempotent Canvas identity gate",
          )
          case = replace_once(
              case,
              '        if (\n          navigationRef.current.selectedChatId !== chatId',
              '        if (\n          !requestedIdentityOwned\n          || navigationRef.current.selectedChatId !== chatId',
              "committing Canvas identity gate",
          )
          case = replace_once(
              case,
              '        if (activeDocumentId) setEditorBuffers((currentBuffers) => removeEditorBuffer(currentBuffers, activeDocumentId));\n        return { status: "updated", revision };',
              '        setEditorBuffers((currentBuffers) => removeEditorBuffer(currentBuffers, documentId));\n        return { status: "updated", revision };',
              "committed Canvas buffer cleanup",
          )
          if "activeDocumentId" in case:
              raise SystemExit("stale Canvas cleanup identity survived")
          text = text[:case_start] + case + text[case_end:]
          app.write_text(text, encoding="utf-8", newline="\n")

          app_test = Path("app/src/app/StudioApp.test.tsx")
          text = app_test.read_text(encoding="utf-8")
          expected_id = 'JSON.stringify(["canvas", rootSession.sessionId, chat.id, "a1", 0, 1])'
          text = replace_once(
              text,
              '      expect(apply).toEqual(expect.objectContaining({ payload: { chatId: chat.id, messageId: "a1", expectedRevision: 1, content: "Studio-only revision" } }));',
              f'      expect(apply).toEqual(expect.objectContaining({{ payload: {{ documentId: {expected_id}, chatId: chat.id, messageId: "a1", expectedRevision: 1, content: "Studio-only revision" }} }}));',
              "Studio Apply expectation",
          )
          text = replace_once(
              text,
              '      let replay: StudioOperationOutcome | undefined;\n      let stale: StudioOperationOutcome | undefined;',
              '      let replay: StudioOperationOutcome | undefined;\n      let foreignIdentity: StudioOperationOutcome | undefined;\n      let stale: StudioOperationOutcome | undefined;',
              "foreign identity outcome",
          )
          text = replace_once(
              text,
              '        replay = await activeDispatch(apply);\n        stale = await activeDispatch({ action: "editor.canvas.apply", payload: { chatId: chat.id, messageId: "a1", expectedRevision: 1, content: "stale overwrite" } });',
              f'        replay = await activeDispatch(apply);\n        foreignIdentity = await activeDispatch({{ action: "editor.canvas.apply", payload: {{ documentId: JSON.stringify(["canvas", rootSession.sessionId, chat.id, "a1", 1, 1]), chatId: chat.id, messageId: "a1", expectedRevision: 1, content: "Studio-only revision" }} }});\n        stale = await activeDispatch({{ action: "editor.canvas.apply", payload: {{ documentId: {expected_id}, chatId: chat.id, messageId: "a1", expectedRevision: 1, content: "stale overwrite" }} }});',
              "Canvas replay operations",
          )
          text = replace_once(
              text,
              '      expect(replay).toEqual({ status: "updated", revision: 2 });\n      expect(stale).toEqual({ status: "rejected", reason: "The Canvas display revision changed before Apply completed.", retryable: false });',
              '      expect(replay).toEqual({ status: "updated", revision: 2 });\n      expect(foreignIdentity).toEqual({ status: "rejected", reason: "The Canvas display revision changed before Apply completed.", retryable: false });\n      expect(stale).toEqual({ status: "rejected", reason: "The Canvas display revision changed before Apply completed.", retryable: false });',
              "Canvas replay expectations",
          )
          app_test.write_text(text, encoding="utf-8", newline="\n")

          store_test = Path("app/src/features/editor/editorBufferStore.test.ts")
          text = store_test.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '  artifactEditorDocumentId,',
              '  artifactEditorDocumentId,\n  boundEditorBufferContent,',
              "bound helper test import",
          )
          test_anchor = '  it("preserves an intentional empty draft, bounds content without splitting a surrogate pair, and clears one identity", () => {'
          direct_test = '''  it("shares the surrogate-safe input bound with the editor surface", () => {\n    const bounded = boundEditorBufferContent(`${"x".repeat(MAX_EDITOR_BUFFER_CODE_UNITS - 1)}😀`);\n    expect(bounded).toHaveLength(MAX_EDITOR_BUFFER_CODE_UNITS - 1);\n    expect(bounded.endsWith("\\ud83d")).toBe(false);\n  });\n\n'''
          text = replace_once(text, test_anchor, direct_test + test_anchor, "shared bound regression")
          store_test.write_text(text, encoding="utf-8", newline="\n")

      - name: Run focused regressions and production build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run src/app/StudioApp.test.tsx src/features/editor/EditorPane.test.tsx src/features/editor/editorBufferStore.test.ts --maxWorkers=2 --no-file-parallelism
          npm run build

      - name: Commit exact identity repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/contracts/studioOperations.ts app/src/app/StudioApp.tsx app/src/app/StudioApp.test.tsx app/src/features/editor/EditorPane.tsx app/src/features/editor/EditorPane.test.tsx app/src/features/editor/editorBufferStore.ts app/src/features/editor/editorBufferStore.test.ts
          git commit -m "fix(editor): bind Canvas Apply to the exact document identity"
          git push origin HEAD:work/editor-buffer-persistence
