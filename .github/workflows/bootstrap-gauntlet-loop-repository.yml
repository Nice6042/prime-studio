name: Bootstrap standalone Gauntlet Loop repository

on:
  push:
    branches:
      - gauntlet-loop-release
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt least-privilege repository creation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"name":"gauntlet-loop","description":"Portable, explicitly invoked Builder-Critic multi-agent quality campaign","private":false,"auto_init":true,"has_issues":true,"has_projects":false,"has_wiki":false}'
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/repos \
            --data "$payload")"
          if [[ "$status" == "201" ]]; then
            echo "Repository created."
            exit 0
          fi
          if [[ "$status" == "422" ]] && grep -q 'name already exists' "$response_file"; then
            echo "Repository already exists."
            exit 0
          fi
          echo "Repository bootstrap denied with HTTP ${status}."
          python - "$response_file" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              print("GitHub returned a non-JSON error response.")
          else:
              print(payload.get("message", "GitHub rejected the request."))
          PY
          exit 1
