name: Repair final Windows host boundaries

on:
  push:
    branches:
      - work/windows-host-verification-kit-v2
    paths:
      - .github/workflows/repair-windows-host-final-hardening.yml

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/windows-host-verification-kit-v2
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Apply final host-kit hardening
        shell: pwsh
        run: |
          python -m py_compile .github/repair-windows-host-final-hardening.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/repair-windows-host-final-hardening.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run source contract test
        shell: pwsh
        run: |
          node --test tests/windows-host-verification-kit.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows PowerShell self-test
        shell: pwsh
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File app/scripts/windows-host-verification/Test-WindowsHostVerificationKit.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit final hardening
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            app/scripts/windows-host-verification/WindowsHostVerification.psm1 `
            app/scripts/windows-host-verification/Test-WindowsHostVerificationKit.ps1 `
            docs/windows-host-verification.md `
            tests/windows-host-verification-kit.test.mjs
          git commit -m "fix(host): preserve failed commands and literal path identities"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:work/windows-host-verification-kit-v2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
