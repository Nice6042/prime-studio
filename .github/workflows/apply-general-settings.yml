name: Apply reviewed General settings completion

on:
  push:
    branches:
      - work/complete-general-settings
    paths:
      - .github/workflows/apply-general-settings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out General settings branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-general-settings
          persist-credentials: true

      - name: Apply reviewed patch
        shell: bash
        run: python .github/general_settings_patch.py

      - name: Validate final tree
        shell: bash
        run: |
          grep -F '"layout.panels.reset": EmptyPayload' app/src/contracts/studioOperations.ts
          grep -F 'settings.default-workspace.pick' app/src/features/settings/SettingsPages.tsx
          grep -F 'layout={layout}' app/src/app/StudioApp.tsx
          grep -F 'General settings persist applied defaults' app/e2e/browser-shell.spec.ts
          grep -F 'complete: 78' app/src/contracts/packageAcceptance.test.ts
          test ! -e .github/workflows/apply-general-settings.yml
          test ! -e .github/general_settings_patch.py
          git diff --check

      - name: Commit reviewed General settings completion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/apply-general-settings.yml .github/general_settings_patch.py
          git commit -m "feat(settings): complete owned General defaults"
          git push origin HEAD:work/complete-general-settings
