name: Apply reviewed General settings completion

on:
  push:
    branches:
      - work/complete-general-settings
    paths:
      - .github/workflows/apply-general-settings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out General settings branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-general-settings
          persist-credentials: true

      - name: Apply source and evidence changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(before) != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {text.count(before)}")
              target.write_text(text.replace(before, after), encoding="utf-8", newline="\n")

          # Closed action vocabulary: one owned picker and one owned whole-layout reset.
          replace_once(
              "app/src/contracts/studioOperations.ts",
              '  "layout.editor.close": EmptyPayload;\n',
              '  "layout.editor.close": EmptyPayload;\n  "layout.panels.reset": EmptyPayload;\n',
          )
          replace_once(
              "app/src/contracts/studioOperations.ts",
              '  "settings.search.change": Readonly<{ query: string }>;\n',
              '  "settings.default-workspace.pick": EmptyPayload;\n  "settings.search.change": Readonly<{ query: string }>;\n',
          )
          replace_once(
              "app/src/contracts/studioOperations.ts",
              '  "layout.editor.toggle": R("layout_preferences"), "layout.editor.resize": R("layout_preferences"), "layout.editor.close": R("layout_preferences"), "overlay.topmost.close": R(),\n',
              '  "layout.editor.toggle": R("layout_preferences"), "layout.editor.resize": R("layout_preferences"), "layout.editor.close": R("layout_preferences"), "layout.panels.reset": R("layout_preferences"), "overlay.topmost.close": R(),\n',
          )
          replace_once(
              "app/src/contracts/studioOperations.ts",
              '  "settings.search.change": R(), "settings.section.select": R(), "settings.preference.set": D("settings"), "settings.preference.reset": D("settings"),\n',
              '  "settings.default-workspace.pick": N("dialog"), "settings.search.change": R(), "settings.section.select": R(), "settings.preference.set": D("settings"), "settings.preference.reset": D("settings"),\n',
          )

          # General page: applied defaults, user-selected workspace, persisted pane widths, and reset.
          settings_pages = Path("app/src/features/settings/SettingsPages.tsx")
          text = settings_pages.read_text(encoding="utf-8")
          text = text.replace(
              'import type { Account, AppSettings } from "../../types";',
              'import type { Account, AppSettings, LayoutPreferencesV1 } from "../../types";',
          )
          start = text.index('export function GeneralSettings(')
          end = text.index('\nexport function AppearanceSettings', start)
          general = '''export function GeneralSettings({ settings, layout, onSetting, onExecute }: {
  readonly settings: AppSettings;
  readonly layout?: LayoutPreferencesV1;
  readonly onSetting?: SettingWriter;
  readonly onExecute?: (operation: StudioOperation) => Promise<StudioOperationOutcome>;
}) {
  const [workspaceBusy, setWorkspaceBusy] = useState(false);
  const [workspaceStatus, setWorkspaceStatus] = useState<string | null>(null);
  const currentLayout = layout ?? {
    schemaVersion: 1,
    sidebarOpen: true,
    sidebarWidth: 264,
    inspectorOpen: true,
    inspectorWidth: 384,
    editorOpen: false,
    editorWidth: 400,
    expandedProjectIds: [],
  };
  const picker = createControlBinding("settings.default-workspace.pick", "settings.default-workspace.pick");
  const workspaceReset = createControlBinding("settings.default-workspace.reset", "settings.preference.reset");
  const layoutReset = createControlBinding("settings.panel-layout.reset", "layout.panels.reset");
  const sidebarWidth = createControlBinding("settings.panel-layout.sidebar-width", "layout.sidebar.resize");
  const inspectorWidth = createControlBinding("settings.panel-layout.inspector-width", "layout.inspector.resize");
  const editorWidth = createControlBinding("settings.panel-layout.editor-width", "layout.editor.resize");
  const canPickWorkspace = Boolean(onExecute && onSetting);

  const pickWorkspace = async () => {
    if (!onExecute || !onSetting || workspaceBusy) return;
    setWorkspaceBusy(true);
    setWorkspaceStatus(null);
    try {
      const outcome = await onExecute({ action: "settings.default-workspace.pick", payload: {} });
      if (outcome.status === "updated" && typeof outcome.revision === "string" && outcome.revision.trim()) {
        onSetting("defaultCwd", outcome.revision);
        setWorkspaceStatus("Default workspace selected.");
      } else if (outcome.status === "cancelled") {
        setWorkspaceStatus("Workspace selection cancelled.");
      } else if (outcome.status === "unavailable" || outcome.status === "rejected") {
        setWorkspaceStatus(outcome.reason);
      }
    } finally {
      setWorkspaceBusy(false);
    }
  };

  const resize = (operation: StudioOperation) => {
    if (onExecute) void onExecute(operation);
  };

  return <>
    <SettingGroup title="Defaults">
      <Row label="Theme" description="Choose the application color scheme; System follows Windows live."><SettingSelect label="Theme" value={settings.theme ?? "system"} setting="theme" onSetting={onSetting} options={[{ value: "system", label: "System" }, { value: "dark", label: "Dark" }, { value: "light", label: "Light" }]} /></Row>
      <Row label="Density" description="Adjust vertical spacing without changing text size or pane geometry."><SettingSelect label="Density" value={settings.density ?? "comfortable"} setting="density" onSetting={onSetting} options={[{ value: "comfortable", label: "Comfortable" }, { value: "compact", label: "Compact" }]} /></Row>
      <Row label="Send shortcut" description="Choose whether Enter or Ctrl+Enter submits a prompt."><SettingSelect label="Send shortcut" value={settings.sendShortcut ?? "enter"} setting="sendShortcut" onSetting={onSetting} options={[{ value: "enter", label: "Enter" }, { value: "ctrl-enter", label: "Ctrl+Enter" }]} /></Row>
      <Row label="Reduced motion" description="Reduce pulsing and animated transitions throughout the workspace."><SettingSwitch label="Reduced motion" enabled={boolValue(settings.reducedMotion, false)} setting="reducedMotion" onSetting={onSetting} /></Row>
    </SettingGroup>

    <SettingGroup title="Workspace">
      <Row label="Default project" description="New resident chats use this user-selected working directory; clearing it asks each time.">
        <div className="studio-setting-workspace-control">
          <span className="studio-setting-value studio-setting-path">{settings.defaultCwd || "Ask each time"}</span>
          <div className="studio-setting-button-row">
            <button type="button" aria-label="Browse default workspace" data-control-id={picker.controlId} data-action={picker.action} disabled={!canPickWorkspace || workspaceBusy} title={!canPickWorkspace ? "A native directory picker and settings authority are required." : undefined} onClick={() => void pickWorkspace()}>{workspaceBusy ? "Choosing…" : "Browse…"}</button>
            <button type="button" data-control-id={workspaceReset.controlId} data-action={workspaceReset.action} disabled={!onSetting || !settings.defaultCwd} onClick={() => { setWorkspaceStatus(null); onSetting?.("defaultCwd", null); }}>Ask each time</button>
          </div>
          {workspaceStatus && <small className="studio-setting-operation-status" role="status">{workspaceStatus}</small>}
        </div>
      </Row>
    </SettingGroup>

    <SettingGroup title="Panel layout">
      <Row label="Projects panel width" description="Preferred width before the responsive solver protects the conversation center."><label className="studio-setting-range"><input type="range" aria-label="Projects panel width" min={210} max={380} value={currentLayout.sidebarWidth} data-control-id={sidebarWidth.controlId} data-action={sidebarWidth.action} disabled={!onExecute} onChange={(event) => resize({ action: "layout.sidebar.resize", payload: { width: Number(event.currentTarget.value) } })} /><output>{currentLayout.sidebarWidth}px</output></label></Row>
      <Row label="Harness panel width" description="Preferred operational-inspector width at desktop geometries."><label className="studio-setting-range"><input type="range" aria-label="Harness panel width" min={300} max={600} value={currentLayout.inspectorWidth} data-control-id={inspectorWidth.controlId} data-action={inspectorWidth.action} disabled={!onExecute} onChange={(event) => resize({ action: "layout.inspector.resize", payload: { width: Number(event.currentTarget.value) } })} /><output>{currentLayout.inspectorWidth}px</output></label></Row>
      <Row label="Editor panel width" description="Preferred width for identity-bound Diff, Edit, and Canvas documents."><label className="studio-setting-range"><input type="range" aria-label="Editor panel width" min={280} max={600} value={currentLayout.editorWidth} data-control-id={editorWidth.controlId} data-action={editorWidth.action} disabled={!onExecute} onChange={(event) => resize({ action: "layout.editor.resize", payload: { width: Number(event.currentTarget.value) } })} /><output>{currentLayout.editorWidth}px</output></label></Row>
      <Row label="Restore panel layout" description="Restore the reviewed 264px Projects, 384px Harness, and 400px Editor defaults and reopen the standard desktop panes."><button type="button" data-control-id={layoutReset.controlId} data-action={layoutReset.action} disabled={!onExecute} onClick={() => resize({ action: "layout.panels.reset", payload: {} })}>Restore defaults</button></Row>
    </SettingGroup>

    <Unavailable>{unappliedReason}</Unavailable>
    <SettingGroup title="Unavailable preferences">
      <Row label="Default file open destination" description="Choose where verified files and folders open."><SettingSelect label="Default file open destination" value={settings.fileOpenDestination ?? "system"} setting="fileOpenDestination" onSetting={onSetting} disabled reason={unappliedReason} options={[{ value: "system", label: "System default" }, { value: "vscode", label: "VS Code" }, { value: "studio", label: "Prime Studio" }]} /></Row>
      <Row label="Language" description="Language used by the application interface."><SettingSelect label="Language" value={settings.language ?? "auto"} setting="language" onSetting={onSetting} disabled reason={unappliedReason} options={[{ value: "auto", label: "Auto detect" }, { value: "en", label: "English" }]} /></Row>
      <Row label="Bottom panel" description="Show the terminal and diagnostics panel control in the app header."><SettingSwitch label="Bottom panel" enabled={boolValue(settings.bottomPanel, false)} setting="bottomPanel" onSetting={onSetting} disabled reason={unappliedReason} /></Row>
    </SettingGroup>
  </>;
}
'''
          text = text[:start] + general + text[end:]
          settings_pages.write_text(text, encoding="utf-8", newline="\n")

          # Route the actual layout snapshot and owned operation dispatcher into General.
          replace_once(
              "app/src/features/settings/SettingsShell.tsx",
              'import type { Account, AppSettings } from "../../types";',
              'import type { Account, AppSettings, LayoutPreferencesV1 } from "../../types";',
          )
          replace_once(
              "app/src/features/settings/SettingsShell.tsx",
              '  readonly settings?: AppSettings;\n',
              '  readonly settings?: AppSettings;\n  readonly layout?: LayoutPreferencesV1;\n',
          )
          replace_once(
              "app/src/features/settings/SettingsShell.tsx",
              'function SettingsPage({ section, compatibility, runtime = null, onExecute, settings = {}, onSetting, onHarnessSetting, onToolSetting, accounts = [],',
              'function SettingsPage({ section, compatibility, runtime = null, onExecute, settings = {}, layout, onSetting, onHarnessSetting, onToolSetting, accounts = [],',
          )
          replace_once(
              "app/src/features/settings/SettingsShell.tsx",
              '    case "general": return <GeneralSettings settings={settings} onSetting={onSetting} />;',
              '    case "general": return <GeneralSettings settings={settings} layout={layout} onSetting={onSetting} onExecute={onExecute} />;',
          )
          replace_once(
              "app/src/features/settings/SettingsShell.tsx",
              'export function SettingsShell({ section, onSection, onBack, compatibility, runtime, onExecute, settings, onSetting,',
              'export function SettingsShell({ section, onSection, onBack, compatibility, runtime, onExecute, settings, layout, onSetting,',
          )
          replace_once(
              "app/src/features/settings/SettingsShell.tsx",
              ' settings={settings} onSetting={onSetting}',
              ' settings={settings} layout={layout} onSetting={onSetting}',
          )

          # Implement the two new action routes at the one product dispatcher.
          replace_once(
              "app/src/app/StudioApp.tsx",
              '      case "layout.editor.close": setActiveSheet(null); return changeLayout({ editorOpen: false });\n',
              '      case "layout.editor.close": setActiveSheet(null); return changeLayout({ editorOpen: false });\n      case "layout.panels.reset":\n        setActiveSheet(null);\n        return changeLayout((current) => ({ ...current, sidebarOpen: true, sidebarWidth: 264, inspectorOpen: true, inspectorWidth: 384, editorOpen: false, editorWidth: 400 }));\n',
          )
          replace_once(
              "app/src/app/StudioApp.tsx",
              '      case "conversation.response.copy": await navigator.clipboard.writeText(operation.payload.text); break;\n',
              '      case "settings.default-workspace.pick": {\n        const directory = await rpc.pickDirectory();\n        if (!directory) return { status: "cancelled", commandId: null };\n        return { status: "updated", revision: directory };\n      }\n      case "conversation.response.copy": await navigator.clipboard.writeText(operation.payload.text); break;\n',
          )
          replace_once(
              "app/src/app/StudioApp.tsx",
              '      settings={settings}\n      accounts={accounts}',
              '      settings={settings}\n      layout={layout}\n      accounts={accounts}',
          )

          # Search truth includes every applied General control.
          replace_once(
              "app/src/features/settings/settingsRegistry.ts",
              '{ id: "general", group: "Preferences", label: "General", description: "Workspace, language, and file-opening defaults.", keywords: ["workspace", "editor", "language"] },',
              '{ id: "general", group: "Preferences", label: "General", description: "Theme, density, workspace, sending, motion, and panel defaults.", keywords: ["theme", "density", "workspace", "project", "working directory", "send", "motion", "panel", "width", "restore", "language", "editor"] },',
          )

          # Compact responsive presentation for the new controls.
          css = Path("app/src/features/settings/settings.css")
          css_text = css.read_text(encoding="utf-8")
          marker = "/* General settings owned controls */"
          if marker in css_text:
              raise SystemExit("General settings CSS already present")
          css_text += '''\n\n/* General settings owned controls */
          .studio-setting-workspace-control { display:grid; justify-items:end; gap:8px; min-width:min(360px,42vw); }
          .studio-setting-button-row { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:7px; }
          .studio-setting-operation-status { max-width:360px; color:#7ee2b8; font-size:11px; text-align:end; }
          .studio-setting-range { display:grid; grid-template-columns:minmax(130px,220px) 54px; align-items:center; gap:10px; }
          .studio-setting-range input { width:100%; min-width:130px; padding:0; accent-color:var(--focus,#8e85f0); }
          .studio-setting-range output { color:var(--muted,#b5b5b5); font:11.5px/1.3 Consolas,monospace; text-align:end; }
          @media (max-width:760px) {
            .studio-setting-workspace-control { justify-items:start; min-width:0; width:100%; }
            .studio-setting-button-row { justify-content:flex-start; }
            .studio-setting-operation-status { text-align:start; }
            .studio-setting-range { width:min(100%,340px); grid-template-columns:minmax(120px,1fr) 54px; }
          }
          @media (forced-colors:active) {
            .studio-setting-range input { forced-color-adjust:auto; }
          }
          '''
          css.write_text(css_text, encoding="utf-8", newline="\n")

          # Close native validation for the values this page now exposes.
          replace_once(
              "app/src-tauri/src/lib.rs",
              '    match key {\n        "accent" => matches!(value, "prime-violet" | "slate" | "ember"),\n',
              '    match key {\n        "theme" => matches!(value, "dark" | "light" | "system"),\n        "density" => matches!(value, "comfortable" | "compact"),\n        "reducedMotion" => matches!(value, "enabled" | "disabled"),\n        "sendShortcut" => matches!(value, "enter" | "ctrl-enter"),\n        "defaultCwd" => value.len() <= 32_767 && !value.chars().any(char::is_control),\n        "accent" => matches!(value, "prime-violet" | "slate" | "ember"),\n',
          )
          replace_once(
              "app/src-tauri/src/lib.rs",
              'fn set_app_setting_impl(key: String, value: Option<String>) -> Result<Settings, String> {\n',
              '''#[cfg(test)]
          mod general_setting_validation_tests {
              use super::validate_closed_setting_value;

              #[test]
              fn general_setting_values_fail_closed() {
                  assert!(validate_closed_setting_value("theme", "system"));
                  assert!(!validate_closed_setting_value("theme", "midnight"));
                  assert!(validate_closed_setting_value("density", "compact"));
                  assert!(!validate_closed_setting_value("density", "dense"));
                  assert!(validate_closed_setting_value("reducedMotion", "enabled"));
                  assert!(!validate_closed_setting_value("reducedMotion", "sometimes"));
                  assert!(validate_closed_setting_value("sendShortcut", "ctrl-enter"));
                  assert!(!validate_closed_setting_value("sendShortcut", "alt-enter"));
                  assert!(validate_closed_setting_value("defaultCwd", r"C:\\work\\prime"));
                  assert!(!validate_closed_setting_value("defaultCwd", "bad\\npath"));
                  assert!(!validate_closed_setting_value("defaultCwd", &"x".repeat(32_768)));
              }
          }

          fn set_app_setting_impl(key: String, value: Option<String>) -> Result<Settings, String> {
          ''',
          )

          # Component evidence for every interaction and its exact owner.
          replace_once(
              "app/src/features/settings/SettingsShell.test.tsx",
              'import { render, screen } from "@testing-library/react";\n',
              'import { fireEvent, render, screen, waitFor } from "@testing-library/react";\n',
          )
          replace_once(
              "app/src/features/settings/SettingsShell.test.tsx",
              'import type { HarnessCompatibility, RuntimeIdentity } from "../../shared/ipc/harness.generated";\n',
              'import type { HarnessCompatibility, RuntimeIdentity } from "../../shared/ipc/harness.generated";\nimport type { StudioOperation, StudioOperationOutcome } from "../../contracts/studioOperations";\n',
          )
          test_anchor = '  it("wires appearance and composer controls to typed persistence instead of local cosmetic state", async () => {\n'
          general_test = '''  it("wires every General default through its owned persistence or dialog boundary", async () => {
              const onSetting = vi.fn();
              const onExecute = vi.fn(async (operation: StudioOperation): Promise<StudioOperationOutcome> => operation.action === "settings.default-workspace.pick"
                ? { status: "updated", revision: "C:\\\\work\\\\prime" }
                : { status: "updated", revision: "layout" });
              render(<SettingsShell
                section="general"
                onBack={() => undefined}
                onSection={() => undefined}
                compatibility={unavailable}
                onSetting={onSetting}
                onExecute={onExecute}
                settings={{ theme: "system", density: "comfortable", sendShortcut: "enter", reducedMotion: "disabled", defaultCwd: "D:\\\\old" }}
                layout={{ schemaVersion: 1, sidebarOpen: true, sidebarWidth: 264, inspectorOpen: true, inspectorWidth: 384, editorOpen: false, editorWidth: 400, expandedProjectIds: [] }}
              />);

              await userEvent.selectOptions(screen.getByRole("combobox", { name: "Theme" }), "light");
              await userEvent.selectOptions(screen.getByRole("combobox", { name: "Density" }), "compact");
              await userEvent.selectOptions(screen.getByRole("combobox", { name: "Send shortcut" }), "ctrl-enter");
              await userEvent.click(screen.getByRole("switch", { name: "Reduced motion" }));
              fireEvent.change(screen.getByRole("slider", { name: "Projects panel width" }), { target: { value: "320" } });
              await userEvent.click(screen.getByRole("button", { name: "Browse default workspace" }));
              await userEvent.click(screen.getByRole("button", { name: "Restore defaults" }));
              await userEvent.click(screen.getByRole("button", { name: "Ask each time" }));

              expect(onSetting).toHaveBeenCalledWith("theme", "light");
              expect(onSetting).toHaveBeenCalledWith("density", "compact");
              expect(onSetting).toHaveBeenCalledWith("sendShortcut", "ctrl-enter");
              expect(onSetting).toHaveBeenCalledWith("reducedMotion", "enabled");
              await waitFor(() => expect(onSetting).toHaveBeenCalledWith("defaultCwd", "C:\\\\work\\\\prime"));
              expect(onSetting).toHaveBeenCalledWith("defaultCwd", null);
              expect(onExecute).toHaveBeenCalledWith({ action: "settings.default-workspace.pick", payload: {} });
              expect(onExecute).toHaveBeenCalledWith({ action: "layout.sidebar.resize", payload: { width: 320 } });
              expect(onExecute).toHaveBeenCalledWith({ action: "layout.panels.reset", payload: {} });
              expect(screen.getByRole("combobox", { name: "Language" })).toBeDisabled();
            });

          '''
          replace_once("app/src/features/settings/SettingsShell.test.tsx", test_anchor, general_test + test_anchor)

          # Promote only after the source and executable evidence are present.
          replace_once(
              "app/src/contracts/packageAcceptance.ts",
              '  row("ST-03", "General page wires theme, density, default project, send shortcut, panel width, restore, and motion", "partial", ["settings.preference.set", "settings.preference.reset"]),\n',
              '  row("ST-03", "General page wires theme, density, default project, send shortcut, panel width, restore, and motion", "complete", ["settings.preference.set", "settings.preference.reset", "settings.default-workspace.pick", "layout.sidebar.resize", "layout.inspector.resize", "layout.editor.resize", "layout.panels.reset"]),\n',
          )
          replace_once(
              "app/src/contracts/packageAcceptance.test.ts",
              '    expect(PACKAGE_CONTROLS).toHaveLength(154);\n',
              '    expect(PACKAGE_CONTROLS).toHaveLength(159);\n',
          )
          replace_once(
              "app/src/contracts/packageAcceptance.test.ts",
              '      complete: 77,\n      partial: 36,\n',
              '      complete: 78,\n      partial: 35,\n',
          )
          acceptance_anchor = '  it("records applied appearance and composer-local preferences as complete", () => {\n'
          acceptance_test = '''  it("records the owned General defaults and panel controls as complete", () => {
              const feature = FEATURE_ACCEPTANCE.find((candidate) => candidate.id === "ST-03");
              expect(feature?.current).toBe("complete");
              expect(feature?.actions).toEqual([
                "settings.preference.set",
                "settings.preference.reset",
                "settings.default-workspace.pick",
                "layout.sidebar.resize",
                "layout.inspector.resize",
                "layout.editor.resize",
                "layout.panels.reset",
              ]);
            });

          '''
          replace_once("app/src/contracts/packageAcceptance.test.ts", acceptance_anchor, acceptance_test + acceptance_anchor)

          # Browser fixture exposes a deterministic user-selected directory.
          replace_once(
              "app/e2e/support/browser-shell.ts",
              '          case "get_app_settings":\n            return { ...appSettings };\n',
              '          case "pick_directory":\n            return "D:\\\\fixture\\\\Selected Workspace";\n          case "get_app_settings":\n            return { ...appSettings };\n',
          )

          # Full browser evidence: application tokens, setting writes, native picker, layout writes, and restore.
          browser_anchor = 'test("registry keeps Ctrl+N K comma B J in parity with visible commands and Settings rows", async ({ shellPage }) => {\n'
          browser_test = '''test("General settings persist applied defaults and own workspace and panel layout changes", async ({ shellPage }) => {
            await shellPage.keyboard.press("Control+,");
            await shellPage.getByRole("button", { name: /^General/ }).click();
            await shellPage.getByRole("combobox", { name: "Theme" }).selectOption("light");
            await shellPage.getByRole("combobox", { name: "Density" }).selectOption("compact");
            await shellPage.getByRole("combobox", { name: "Send shortcut" }).selectOption("ctrl-enter");
            await shellPage.getByRole("switch", { name: "Reduced motion" }).click();
            await shellPage.getByRole("button", { name: "Browse default workspace" }).click();
            await expect(shellPage.getByText("D:\\\\fixture\\\\Selected Workspace", { exact: true })).toBeVisible();

            const setRange = async (name: string, value: number) => {
              await shellPage.getByRole("slider", { name }).evaluate((element, next) => {
                const input = element as HTMLInputElement;
                const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value")?.set;
                setter?.call(input, String(next));
                input.dispatchEvent(new Event("input", { bubbles: true }));
                input.dispatchEvent(new Event("change", { bubbles: true }));
              }, value);
            };
            await setRange("Projects panel width", 320);
            await setRange("Harness panel width", 470);
            await setRange("Editor panel width", 510);
            await expect(shellPage.getByText("320px", { exact: true })).toBeVisible();
            await expect(shellPage.getByText("470px", { exact: true })).toBeVisible();
            await expect(shellPage.getByText("510px", { exact: true })).toBeVisible();
            await shellPage.getByRole("button", { name: "Restore defaults" }).click();
            await expect(shellPage.getByText("264px", { exact: true })).toBeVisible();
            await expect(shellPage.getByText("384px", { exact: true })).toBeVisible();
            await expect(shellPage.getByText("400px", { exact: true })).toBeVisible();
            await shellPage.getByRole("button", { name: "Back to chat" }).click();

            await expect(shellPage.locator("html")).toHaveAttribute("data-theme", "light");
            await expect(shellPage.locator("html")).toHaveAttribute("data-density", "compact");
            await expect(shellPage.locator("html")).toHaveAttribute("data-reduced-motion", "true");

            const requests = await shellPage.evaluate(() => (window as typeof window & {
              __PRIME_STUDIO_BROWSER_REQUESTS__?: Array<{ command: string; args: Record<string, unknown> }>;
            }).__PRIME_STUDIO_BROWSER_REQUESTS__ ?? []);
            const settingKeys = requests.filter((request) => request.command === "set_app_setting").map((request) => request.args.key);
            expect(settingKeys).toEqual(expect.arrayContaining(["theme", "density", "sendShortcut", "reducedMotion", "defaultCwd"]));
