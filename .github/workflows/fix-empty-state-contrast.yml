name: Fix empty-state contrast

on:
  push:
    branches:
      - work/complete-product-reflow-final
    paths:
      - .github/workflows/fix-empty-state-contrast.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-product-reflow-final
          persist-credentials: true

      - name: Repair empty-state contrast and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          css = Path("app/src/features/conversation/conversation.css")
          text = css.read_text(encoding="utf-8")
          before = '.conversation-empty small { margin-block-start: 10px; color: #6d6d78; }'
          after = '.conversation-empty small { margin-block-start: 10px; color: #9a9aa6; }'
          if text.count(before) != 1:
              raise SystemExit("empty-state color anchor is not unique")
          css.write_text(text.replace(before, after), encoding="utf-8", newline="\n")
          Path(".github/workflows/fix-empty-state-contrast.yml").unlink()

      - name: Validate and commit
        shell: bash
        run: |
          grep -F '.conversation-empty small { margin-block-start: 10px; color: #9a9aa6; }' app/src/features/conversation/conversation.css
          test ! -e .github/workflows/fix-empty-state-contrast.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(a11y): increase empty-conversation helper contrast"
          git push origin HEAD:work/complete-product-reflow-final
