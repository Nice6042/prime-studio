name: Repair default-project source patch

on:
  push:
    branches:
      - work/complete-general-settings
    paths:
      - .github/workflows/repair-default-project-script.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out General settings branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-general-settings
          persist-credentials: true

      - name: Tighten the Settings General block patch
        shell: python
        run: |
          from pathlib import Path
          path = Path(".github/default_project_flow_patch.py")
          text = path.read_text(encoding="utf-8")
          start_marker = '''replace_once(
              "app/src/features/settings/SettingsPages.tsx",
              '<Row label="Default project"'''
          end_marker = '\n\nproject_test = Path("app/src/features/navigation/ProjectSidebar.test.tsx")'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''settings_pages = Path("app/src/features/settings/SettingsPages.tsx")
          settings_text = settings_pages.read_text(encoding="utf-8")
          before = ''' + '"""' + '''      <Row label="Default project" description="New resident chats use this user-selected working directory; clearing it asks each time.">
                  <div className="studio-setting-workspace-control">
                    <span className="studio-setting-value studio-setting-path">{settings.defaultCwd || "Ask each time"}</span>
                    <div className="studio-setting-button-row">
                      <button type="button" aria-label="Browse default workspace" data-control-id={picker.controlId} data-action={picker.action} disabled={!canPickWorkspace || workspaceBusy} title={!canPickWorkspace ? "A native directory picker and settings authority are required." : undefined} onClick={() => void pickWorkspace()}>{workspaceBusy ? "Choosing…" : "Browse…"}</button>
                      <button type="button" data-control-id={workspaceReset.controlId} data-action={workspaceReset.action} disabled={!onSetting || !settings.defaultCwd} onClick={() => { setWorkspaceStatus(null); onSetting?.("defaultCwd", null); }}>Ask each time</button>
                    </div>
                    {workspaceStatus && <small className="studio-setting-operation-status" role="status">{workspaceStatus}</small>}
                  </div>
                </Row>''' + '"""' + '''
          after = ''' + '"""' + '''      <Row label="Default project" description="New folder-project dialogs start from this user-selected working directory; clearing it requires choosing a folder each time.">
                  <div className="studio-setting-workspace-control">
                    <span className="studio-setting-value studio-setting-path">{settings.defaultCwd || "Choose each time"}</span>
                    <div className="studio-setting-button-row">
                      <button type="button" aria-label="Browse default workspace" data-control-id={picker.controlId} data-action={picker.action} disabled={!canPickWorkspace || workspaceBusy} title={!canPickWorkspace ? "A native directory picker and settings authority are required." : undefined} onClick={() => void pickWorkspace()}>{workspaceBusy ? "Choosing…" : "Browse…"}</button>
                      <button type="button" data-control-id={workspaceReset.controlId} data-action={workspaceReset.action} disabled={!onSetting || !settings.defaultCwd} onClick={() => { setWorkspaceStatus(null); onSetting?.("defaultCwd", null); }}>Choose each time</button>
                    </div>
                    {workspaceStatus && <small className="studio-setting-operation-status" role="status">{workspaceStatus}</small>}
                  </div>
                </Row>''' + '"""' + '''
          if settings_text.count(before) != 1:
              raise SystemExit(f"SettingsPages.tsx: expected one complete General workspace row, found {settings_text.count(before)}")
          settings_pages.write_text(settings_text.replace(before, after), encoding="utf-8", newline="\\n")'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8", newline="\n")
          Path(".github/workflows/repair-default-project-script.yml").unlink()

      - name: Apply corrected default-project flow
        shell: bash
        run: python .github/default_project_flow_patch.py

      - name: Validate final tree
        shell: bash
        run: |
          grep -F 'initialFolderPath={defaultProjectFolder}' app/src/features/navigation/ProjectSidebar.tsx
          grep -F 'defaultProjectFolder={settings.defaultCwd ?? ""}' app/src/app/StudioApp.tsx
          grep -F 'New folder-project dialogs start' app/src/features/settings/SettingsPages.tsx
          grep -F 'prefills a new folder project' app/src/features/navigation/ProjectSidebar.test.tsx
          grep -F 'Folder path' app/e2e/browser-shell.spec.ts | grep -F 'toHaveValue'
          test ! -e .github/workflows/apply-default-project-flow.yml
          test ! -e .github/workflows/repair-default-project-workflow.yml
          test ! -e .github/workflows/repair-default-project-script.yml
          test ! -e .github/default_project_flow_patch.py
          git diff --check

      - name: Commit reviewed default project flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/apply-default-project-flow.yml .github/workflows/repair-default-project-workflow.yml .github/workflows/repair-default-project-script.yml .github/default_project_flow_patch.py
          git commit -m "fix(settings): apply the default folder to new projects"
          git push origin HEAD:work/complete-general-settings
