name: Repair default-project workflow anchor

on:
  push:
    branches:
      - work/complete-general-settings
    paths:
      - .github/workflows/repair-default-project-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out General settings branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-general-settings
          persist-credentials: true

      - name: Repair the ambiguous copy anchor
        shell: python
        run: |
          from pathlib import Path
          path = Path(".github/workflows/apply-default-project-flow.yml")
          text = path.read_text(encoding="utf-8")
          before = '''              '{settings.defaultCwd || "Ask each time"}',
              '{settings.defaultCwd || "Choose each time"}',
          )'''
          after = '''              '<span className="studio-setting-value studio-setting-path">{settings.defaultCwd || "Ask each time"}</span>',
              '<span className="studio-setting-value studio-setting-path">{settings.defaultCwd || "Choose each time"}</span>',
          )'''
          if text.count(before) != 1:
              raise SystemExit(f"expected one ambiguous copy patch, found {text.count(before)}")
          path.write_text(text.replace(before, after), encoding="utf-8", newline="\n")
          Path(".github/workflows/repair-default-project-workflow.yml").unlink()

      - name: Commit repaired workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-default-project-flow.yml .github/workflows/repair-default-project-workflow.yml
          git commit -m "chore: tighten the default project copy anchor"
          git push origin HEAD:work/complete-general-settings
