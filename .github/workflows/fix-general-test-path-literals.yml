name: Repair General component path literals

on:
  push:
    branches:
      - work/complete-general-settings
    paths:
      - .github/workflows/fix-general-test-path-literals.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out General settings branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-general-settings
          persist-credentials: true

      - name: Repair source literals
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/features/settings/SettingsShell.test.tsx")
          text = path.read_text(encoding="utf-8")
          before_selected = r'"C:\work\prime"'
          after_selected = r'"C:\\work\\prime"'
          before_existing = r'"D:\old"'
          after_existing = r'"D:\\old"'
          if text.count(before_selected) != 2:
              raise SystemExit(f"expected two selected-path literals, found {text.count(before_selected)}")
          if text.count(before_existing) != 1:
              raise SystemExit(f"expected one existing-path literal, found {text.count(before_existing)}")
          path.write_text(text.replace(before_selected, after_selected).replace(before_existing, after_existing), encoding="utf-8", newline="\n")
          Path(".github/workflows/fix-general-test-path-literals.yml").unlink()

      - name: Validate final tree
        shell: bash
        run: |
          test "$(grep -F '"C:\\work\\prime"' app/src/features/settings/SettingsShell.test.tsx | wc -l)" -eq 2
          grep -F 'defaultCwd: "D:\\old"' app/src/features/settings/SettingsShell.test.tsx
          test ! -e .github/workflows/fix-general-test-path-literals.yml
          git diff --check

      - name: Commit repaired literals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(settings): preserve General Windows paths literally"
          git push origin HEAD:work/complete-general-settings
