name: Format Interaction Worker Temp

on:
  push:
    branches:
      - "work/format-interaction-temp"
    paths:
      - ".github/workflows/format-interaction-temp.yml"

permissions:
  contents: read

jobs:
  format:
    name: Format interaction worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned 2026-08-10
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Format exact module
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all

      - name: Upload formatted module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formatted-interaction-worker-${{ github.sha }}
          path: app/src-tauri/src/harness/interaction_worker.rs
          retention-days: 1
          if-no-files-found: error
