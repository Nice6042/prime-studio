name: Complete archived-fork wave

on:
  push:
    branches:
      - work/complete-waves-0-6
    paths:
      - .github/workflows/complete-waves-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/complete-waves-0-6
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact reviewed edits
        run: python .github/scripts/complete-waves-codemod.py
      - name: Validate patch shape
        run: git diff --check
      - name: Commit reviewed edits
        run: |
          git config user.name "Prime Studio Automation"
          git config user.email "193861067+Nice6042@users.noreply.github.com"
          git add -A
          git commit -m "feat(conversation): fork archived resident chats"
          git push origin HEAD:work/complete-waves-0-6
