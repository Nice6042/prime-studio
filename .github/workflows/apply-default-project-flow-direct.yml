name: Apply default-project flow directly

on:
  push:
    branches:
      - work/complete-general-settings
    paths:
      - .github/workflows/apply-default-project-flow-direct.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out General settings branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-general-settings
          persist-credentials: true

      - name: Apply reviewed source changes directly
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              target.write_text(text.replace(before, after), encoding="utf-8", newline="\n")

          replace_once(
              "app/src/features/navigation/ProjectSidebar.tsx",
              '''export function CreateProjectDialog({ onCreate, onCancel, restoreFocusTo }: {
            readonly onCreate: (name: string, folderPath: string) => void;
            readonly onCancel: () => void;
            readonly restoreFocusTo?: HTMLElement | null;
          }) {
            const [projectName, setProjectName] = useState("");
            const [folderPath, setFolderPath] = useState("");''',
              '''export function CreateProjectDialog({ onCreate, onCancel, restoreFocusTo, initialFolderPath = "" }: {
            readonly onCreate: (name: string, folderPath: string) => void;
            readonly onCancel: () => void;
            readonly restoreFocusTo?: HTMLElement | null;
            readonly initialFolderPath?: string;
          }) {
            const [projectName, setProjectName] = useState("");
            const [folderPath, setFolderPath] = useState(initialFolderPath);''',
          )
          replace_once(
              "app/src/features/navigation/ProjectSidebar.tsx",
              '''  onExecuteWorkspaceOperation,
            onCollapse,
            newChatDisabledReason,
          }: {''',
              '''  onExecuteWorkspaceOperation,
            onCollapse,
            newChatDisabledReason,
            defaultProjectFolder = "",
          }: {''',
          )
          replace_once(
              "app/src/features/navigation/ProjectSidebar.tsx",
              '''  readonly onCollapse?: () => void;
            readonly newChatDisabledReason?: string;
          }) {''',
              '''  readonly onCollapse?: () => void;
            readonly newChatDisabledReason?: string;
            readonly defaultProjectFolder?: string;
          }) {''',
          )
          replace_once(
              "app/src/features/navigation/ProjectSidebar.tsx",
              '{creatingProject && <CreateProjectDialog restoreFocusTo={newProjectRef.current} onCancel={() => setCreatingProject(false)} onCreate={(name, path) => { onNewProject?.(name, path); setCreatingProject(false); }} />}',
              '{creatingProject && <CreateProjectDialog initialFolderPath={defaultProjectFolder} restoreFocusTo={newProjectRef.current} onCancel={() => setCreatingProject(false)} onCreate={(name, path) => { onNewProject?.(name, path); setCreatingProject(false); }} />}',
          )

          replace_once(
              "app/src/app/StudioApp.tsx",
              '''        onNewChat={createChat}
                  onNewProject={createProject}
                  newChatDisabledReason={newChatDisabledReason}''',
              '''        onNewChat={createChat}
                  onNewProject={createProject}
                  defaultProjectFolder={settings.defaultCwd ?? ""}
                  newChatDisabledReason={newChatDisabledReason}''',
          )
          studio_path = Path("app/src/app/StudioApp.tsx")
          studio_text = studio_path.read_text(encoding="utf-8")
          create_dialog = '{createProjectOpen && <CreateProjectDialog restoreFocusTo={createProjectOpener} onCancel={() => { void dispatchOperation({ action: "surface.popover.toggle", payload: { popoverId: null } }); }} onCreate={(name, folderPath) => { createProject(name, folderPath); void dispatchOperation({ action: "surface.popover.toggle", payload: { popoverId: null } }); }} />}'
          replacement = '{createProjectOpen && <CreateProjectDialog initialFolderPath={settings.defaultCwd ?? ""} restoreFocusTo={createProjectOpener} onCancel={() => { void dispatchOperation({ action: "surface.popover.toggle", payload: { popoverId: null } }); }} onCreate={(name, folderPath) => { createProject(name, folderPath); void dispatchOperation({ action: "surface.popover.toggle", payload: { popoverId: null } }); }} />}'
          if studio_text.count(create_dialog) != 2:
              raise SystemExit(f"StudioApp.tsx: expected two create-project overlays, found {studio_text.count(create_dialog)}")
          studio_path.write_text(studio_text.replace(create_dialog, replacement), encoding="utf-8", newline="\n")

          settings_path = Path("app/src/features/settings/SettingsPages.tsx")
          settings_text = settings_path.read_text(encoding="utf-8")
          row_start = settings_text.index('      <Row label="Default project" description="New resident chats use this user-selected working directory; clearing it asks each time.">')
          row_end = settings_text.index("\n      </Row>", row_start) + len("\n      </Row>")
          before = settings_text[row_start:row_end]
          after = before.replace(
              'description="New resident chats use this user-selected working directory; clearing it asks each time."',
              'description="New folder-project dialogs start from this user-selected working directory; clearing it requires choosing a folder each time."',
          ).replace(
              '{settings.defaultCwd || "Ask each time"}',
              '{settings.defaultCwd || "Choose each time"}',
          ).replace(
              '>Ask each time</button>',
              '>Choose each time</button>',
          )
          if before == after:
              raise SystemExit("SettingsPages.tsx: General workspace row did not change")
          settings_path.write_text(settings_text[:row_start] + after + settings_text[row_end:], encoding="utf-8", newline="\n")

          project_test = Path("app/src/features/navigation/ProjectSidebar.test.tsx")
          project_text = project_test.read_text(encoding="utf-8")
          anchor = '  it("collects a project name and folder before requesting durable creation", async () => {\n'
          evidence = r'''  it("prefills a new folder project from the configured default without silently creating it", async () => {
            const onNewProject = vi.fn();
            render(<ProjectSidebar {...workspaceProps} projects={projects} defaultProjectFolder="D:\\work\\prime" onSelectChat={() => undefined} onToggleProject={() => undefined}
              onNewChat={() => undefined} onOpenSettings={() => undefined} onNewProject={onNewProject} />);

            await userEvent.click(screen.getByRole("button", { name: "New project" }));
            expect(screen.getByRole("textbox", { name: "Folder path" })).toHaveValue("D:\\work\\prime");
            expect(screen.getByRole("button", { name: "Create project" })).toBeDisabled();
            expect(onNewProject).not.toHaveBeenCalled();

            await userEvent.type(screen.getByRole("textbox", { name: "Project name" }), "Default-root project");
            await userEvent.click(screen.getByRole("button", { name: "Create project" }));
            expect(onNewProject).toHaveBeenCalledWith("Default-root project", "D:\\work\\prime");
          });

          '''
          if project_text.count(anchor) != 1:
              raise SystemExit(f"ProjectSidebar.test.tsx: expected one creation test anchor, found {project_text.count(anchor)}")
          project_test.write_text(project_text.replace(anchor, evidence + anchor), encoding="utf-8", newline="\n")

          replace_once(
              "app/src/features/settings/SettingsShell.test.tsx",
              'screen.getByRole("button", { name: "Ask each time" })',
              'screen.getByRole("button", { name: "Choose each time" })',
          )

          browser_path = Path("app/e2e/browser-shell.spec.ts")
          browser_text = browser_path.read_text(encoding="utf-8")
          test_start = browser_text.index('test("General settings persist applied defaults and own workspace and panel layout changes"')
          insertion_point = browser_text.index("\n\n  const setRange", test_start)
          if "New project" in browser_text[test_start:insertion_point]:
              raise SystemExit("browser-shell.spec.ts: default-project evidence already inserted")
          inserted = r'''
            await shellPage.getByRole("button", { name: "Back to chat" }).click();
            await shellPage.getByRole("button", { name: "New project" }).click();
            await expect(shellPage.getByRole("textbox", { name: "Folder path" })).toHaveValue("D:\\fixture\\Selected Workspace");
            await expect(shellPage.getByRole("button", { name: "Create project" })).toBeDisabled();
            await shellPage.keyboard.press("Escape");
            await shellPage.keyboard.press("Control+,");
            await shellPage.getByRole("button", { name: /^General/ }).click();'''
          browser_path.write_text(browser_text[:insertion_point] + inserted + browser_text[insertion_point:], encoding="utf-8", newline="\n")

          for temporary in (
              ".github/workflows/apply-default-project-flow.yml",
              ".github/workflows/repair-default-project-workflow.yml",
              ".github/workflows/repair-default-project-script.yml",
              ".github/workflows/finalize-default-project-flow.yml",
              ".github/workflows/apply-default-project-flow-direct.yml",
              ".github/default_project_flow_patch.py",
          ):
              Path(temporary).unlink(missing_ok=True)

      - name: Validate final tree
        shell: bash
        run: |
          grep -F 'initialFolderPath={defaultProjectFolder}' app/src/features/navigation/ProjectSidebar.tsx
          grep -F 'defaultProjectFolder={settings.defaultCwd ?? ""}' app/src/app/StudioApp.tsx
          grep -F 'New folder-project dialogs start' app/src/features/settings/SettingsPages.tsx
          grep -F 'prefills a new folder project' app/src/features/navigation/ProjectSidebar.test.tsx
          grep -F 'Folder path' app/e2e/browser-shell.spec.ts | grep -F 'toHaveValue'
          test ! -e .github/workflows/apply-default-project-flow.yml
          test ! -e .github/workflows/repair-default-project-workflow.yml
          test ! -e .github/workflows/repair-default-project-script.yml
          test ! -e .github/workflows/finalize-default-project-flow.yml
          test ! -e .github/workflows/apply-default-project-flow-direct.yml
          test ! -e .github/default_project_flow_patch.py
          git diff --check

      - name: Commit reviewed default-project flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(settings): apply the default folder to new projects"
          git push origin HEAD:work/complete-general-settings
