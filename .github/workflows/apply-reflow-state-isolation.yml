name: Apply reflow state isolation

on:
  push:
    branches:
      - work/complete-product-reflow
    paths:
      - .github/workflows/apply-reflow-state-isolation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-product-reflow
          persist-credentials: true

      - name: Isolate every screen state at the same geometry
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("app/e2e/product-reflow.spec.ts")
          text = path.read_text(encoding="utf-8")

          edits = [
            (
              r'''async function exerciseEmptyConversation\(page: Page, target: ProductReflowGeometry\): Promise<void> \{\n  await page\.keyboard\.press\("Control\+N"\);''',
              '''async function exerciseEmptyConversation(page: Page, target: ProductReflowGeometry): Promise<void> {
  await resetProductAtGeometry(page, target);
  await page.keyboard.press("Control+N");''',
              "empty conversation isolation",
            ),
            (
              r'''    await exerciseStreamingConversation\(shellPage, workspace, target\);\n    await exerciseInspectorAndEditorScreens\(shellPage, workspace, harness, target\);\n    await exerciseEmptyConversation\(shellPage, target\);''',
              '''    await exerciseStreamingConversation(shellPage, workspace, target);

    await resetProductAtGeometry(shellPage, target);
    const inspectorWorkspace = shellPage.getByRole("main", { name: "Prime Harness architecture" });
    const refreshedHarness = shellPage.getByRole("complementary", { name: "Harness" });
    await exerciseInspectorAndEditorScreens(shellPage, inspectorWorkspace, refreshedHarness, target);
    await exerciseEmptyConversation(shellPage, target);''',
              "wide screen-state isolation",
            ),
            (
              r'''    await exerciseStreamingConversation\(shellPage, workspace, target\);\n\n    const projectsButton = shellPage\.getByRole\("button", \{ name: "Projects" \}\);''',
              '''    await exerciseStreamingConversation(shellPage, workspace, target);

    await resetProductAtGeometry(shellPage, target);
    const projectsButton = shellPage.getByRole("button", { name: "Projects" });''',
              "compact streaming isolation",
            ),
            (
              r'''    await shellPage\.getByRole\("button", \{ name: "Harness" \}\)\.click\(\);\n    const harness = shellPage\.getByRole\("complementary", \{ name: "Harness" \}\);\n    await expectSurfaceContained\(harness, shellPage, `\$\{target\.id\} Harness sheet`\);\n    await exerciseInspectorAndEditorScreens\(shellPage, workspace, harness, target\);''',
              '''    await resetProductAtGeometry(shellPage, target);
    const inspectorWorkspace = shellPage.getByRole("main", { name: "Prime Harness architecture" });
    await shellPage.getByRole("button", { name: "Harness" }).click();
    const inspectorSheet = shellPage.locator('[data-studio-sheet="inspector"]');
    await expectSurfaceContained(inspectorSheet, shellPage, `${target.id} Harness sheet`);
    const harness = inspectorSheet.getByRole("complementary", { name: "Harness" });
    await expect(harness).toBeVisible();
    await exerciseInspectorAndEditorScreens(shellPage, inspectorWorkspace, harness, target);''',
              "compact inspector-sheet isolation",
            ),
          ]

          for pattern, replacement, label in edits:
            text, count = re.subn(pattern, replacement, text, count=1)
            if count != 1:
              raise SystemExit(f"expected one {label}")

          path.write_text(text, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-reflow-state-isolation.yml").unlink()

      - name: Validate final tree
        shell: bash
        run: |
          grep -F 'const inspectorSheet = shellPage.locator' app/e2e/product-reflow.spec.ts
          grep -F 'const refreshedHarness = shellPage.getByRole' app/e2e/product-reflow.spec.ts
          grep -F 'await resetProductAtGeometry(page, target);' app/e2e/product-reflow.spec.ts
          test ! -e .github/workflows/apply-reflow-state-isolation.yml
          git diff --check

      - name: Commit isolation and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/product-reflow.spec.ts .github/workflows/apply-reflow-state-isolation.yml
          git commit -m "test(e2e): isolate every reflow screen state"
          git push origin HEAD:work/complete-product-reflow
