name: Patch reflow empty state

on:
  push:
    branches:
      - "work/complete-product-reflow"
    paths:
      - ".github/workflows/patch-reflow-empty-state.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/complete-product-reflow

      - name: Apply reviewed empty-state fixture
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const supportPath = 'app/e2e/support/browser-shell.ts';
          let support = fs.readFileSync(supportPath, 'utf8');
          const mapping = '      let projectedHarnessSessions = scenario.sessions.map((session) => ({\n        ...session,';
          const mapped = '      const reflowEmptySession = window.sessionStorage.getItem("prime-studio-reflow-empty-session") === "1";\n      let projectedHarnessSessions = scenario.sessions.map((session) => ({\n        ...session,\n        parentMessages: reflowEmptySession ? [] : session.parentMessages,';
          if (!support.includes(mapping)) throw new Error('Harness session mapping not found');
          support = support.replace(mapping, mapped);
          support = support.replace('      const reflowHarnessDefaults = window.sessionStorage.getItem("prime-studio-reflow-harness-defaults") === "1";\n', '');
          for (const [from, to] of [
            ['        defaultAccount: reflowHarnessDefaults ? null : "account-e2e",', '        defaultAccount: "account-e2e",'],
            ['        defaultProvider: reflowHarnessDefaults ? null : "openai-codex",', '        defaultProvider: "openai-codex",'],
            ['        defaultModel: reflowHarnessDefaults ? null : "gpt-5",', '        defaultModel: "gpt-5",'],
            ['        defaultThinking: reflowHarnessDefaults ? null : "high",', '        defaultThinking: "high",'],
          ]) {
            if (!support.includes(from)) throw new Error(`settings fixture line not found: ${from}`);
            support = support.replace(from, to);
          }
          fs.writeFileSync(supportPath, support);

          const specPath = 'app/e2e/product-reflow.spec.ts';
          let spec = fs.readFileSync(specPath, 'utf8');
          spec = spec.replace(
            'const REFLOW_HARNESS_DEFAULTS_FLAG = "prime-studio-reflow-harness-defaults";',
            'const REFLOW_EMPTY_SESSION_FLAG = "prime-studio-reflow-empty-session";',
          );
          const oldFunction = [
            'async function exerciseEmptyConversation(page: Page, target: ProductReflowGeometry): Promise<void> {',
            '  await page.evaluate((flag) => window.sessionStorage.setItem(flag, "1"), REFLOW_HARNESS_DEFAULTS_FLAG);',
            '  try {',
            '    await resetProductAtGeometry(page, target);',
            '    const newChat = page.getByRole("button", { name: "New chat", exact: true });',
            '    await expect(newChat).toBeEnabled();',
            '    await newChat.click();',
            '    await expect(page.getByRole("heading", { name: "Start a conversation" })).toBeVisible();',
            '    await expect(page.getByRole("textbox", { name: "Message Prime Studio" })).toBeVisible();',
            '    await expectProductViewport(page, `${target.id} empty conversation`);',
            '  } finally {',
            '    await page.evaluate((flag) => window.sessionStorage.removeItem(flag), REFLOW_HARNESS_DEFAULTS_FLAG);',
            '  }',
            '}',
          ].join('\n');
          const newFunction = [
            'async function exerciseEmptyConversation(page: Page, target: ProductReflowGeometry): Promise<void> {',
            '  await page.evaluate((flag) => window.sessionStorage.setItem(flag, "1"), REFLOW_EMPTY_SESSION_FLAG);',
            '  try {',
            '    await resetProductAtGeometry(page, target);',
            '    const conversation = page.getByRole("region", { name: "Prime Harness architecture" });',
            '    await expect(conversation.getByRole("heading", { name: "Start a conversation" })).toBeVisible();',
            '    await expect(page.getByRole("textbox", { name: "Message Prime Studio" })).toBeVisible();',
            '    await expect(conversation.locator("[data-parent-message-id]")).toHaveCount(0);',
            '    await expectProductViewport(page, `${target.id} empty conversation`);',
            '  } finally {',
            '    await page.evaluate((flag) => window.sessionStorage.removeItem(flag), REFLOW_EMPTY_SESSION_FLAG);',
            '  }',
            '}',
          ].join('\n');
          if (!spec.includes(oldFunction)) throw new Error('empty conversation exercise not found');
          spec = spec.replace(oldFunction, newFunction);
          fs.writeFileSync(specPath, spec);
          NODE
          git diff --check

      - name: Commit fixture
        run: |
          git config user.name "Prime Studio automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/e2e/support/browser-shell.ts app/e2e/product-reflow.spec.ts
          git commit -m "test(reflow): project an authoritative empty conversation"
          git push origin HEAD:work/complete-product-reflow
